[package]
name = "hardgate"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
description = "Deterministic quality gates, hard budgets, and anti-gaming verification harness for the AI agent era"
authors = ["Tauan BF <contact@techbytefrontier.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tech-Byte-Frontier/hardgate"
documentation = "https://docs.rs/hardgate"
categories = ["development-tools", "command-line-utilities"]
keywords = ["quality-gate", "ai-agents", "anti-gaming", "code-metrics", "linter"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/build.rs",
  "/src/**",
  "/tests/**/*.rs",
  "/tests/common/*.txt",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
  "/docs/ARCHITECTURE.md",
  "/docs/CLI_AND_INTEGRATION.md",
  "/docs/CONFIGURATION_SPEC.md",
  "/docs/EXISTING_LANDSCAPE.md",
  "/docs/VISION_AND_PARADIGM.md",
]

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"

# Release archives, the shell installer, npm packages, and publication gates
# are hand-authored in `.github/workflows/release.yml`; no cargo-dist metadata
# is emitted so a stale generator cannot silently advertise another channel.
# npm distribution is hand-maintained in npm/* (optionalDependencies pattern,
# pnpm-compatible) and published by the workflow from the same Release
# binaries. Single source of truth for versions is `package.version` above;
# npm/* and the private workspace manifest are synced by
# `node scripts/sync-npm-version.mjs`.

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.5"
rayon = "=1.12.0"
regex = "=1.13.1"
colored = "=3.1.1"
ignore = "=0.4.33"
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
anyhow = "=1.0.104"

tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
globset = "=0.4.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", features = ["process", "fs"] }
