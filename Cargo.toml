[package]
name = "hardgate"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Deterministic quality gates, hard budgets, and anti-gaming verification harness for the AI agent era"
authors = ["Tauan BF <contact@techbytefrontier.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Tech-Byte-Frontier/hardgate"
homepage = "https://github.com/Tech-Byte-Frontier/hardgate"
documentation = "https://docs.rs/hardgate"
categories = ["development-tools", "command-line-utilities"]
keywords = ["quality-gate", "ai-agents", "anti-gaming", "code-metrics", "linter"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"

# cargo-dist release config: prebuilt binaries for GitHub Releases,
# shell/powershell installers and Homebrew.
# npm distribution is hand-maintained in npm/* (optionalDependencies pattern,
# pnpm-compatible) and published by .github/workflows/release.yml `publish-npm`
# job from the same Release binaries. Single source of truth for versions is
# `package.version` above. npm/* versions are synced from here via
# `node scripts/sync-npm-version.mjs`.
[package.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
pr-run-mode = "plan"
installers = ["shell", "powershell", "homebrew"]
tap = "Tech-Byte-Frontier/homebrew-hardgate"
install-path = "CARGO_HOME"
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
include = ["README.md", "LICENSE-MIT", "LICENSE-APACHE", "hardgate.toml"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rayon = "1.10"
regex = "1.11"
colored = "3.0"
ignore = "0.4"
serde_json = "1.0"
anyhow = "1.0"

tree-sitter = "0.24"
tree-sitter-rust = "0.23.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-go = "0.23.4"
globset = "0.4"



