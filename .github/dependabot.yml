version: 2
updates:
  # Keep action references pinned to reviewed commit SHAs. Dependabot PRs run
  # the full CI aggregate before a maintainer reviews the SHA and its comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pinned-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
