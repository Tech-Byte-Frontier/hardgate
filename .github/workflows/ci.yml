name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  RUST_COVERAGE_TOOLCHAIN: nightly-2026-09-04
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_LLVM_COV_VERSION: 0.9.0
  NODE_VERSION: 26.8.1
  NPM_VERSION: 12.0.2
  PNPM_VERSION: 11.25.0
  YARN_VERSION: 4.18.0
  BUN_VERSION: 1.4.0

jobs:
  rust:
    name: Rust format, lint, tests, and audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: RustSec dependency audit
        run: scripts/dependency-audit.sh

  npm-wrapper:
    name: npm quality, wrapper, and SBOM regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" "@yarnpkg/cli-dist@${YARN_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --locked --release
      - run: node scripts/sync-npm-version.mjs --check
      - run: node scripts/check-npm-quality.mjs
      - run: node tests/npm-wrapper.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/npm-wrapper-regression.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/consumer_matrix.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      # The real SBOM generator needs both pinned Node and Cargo, which this
      # job already provisions without another runner/toolchain setup.
      - run: node tests/release_contract.sbom.test.mjs

  hardgate-self:
    name: Hardgate complete self/evidence gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" "@yarnpkg/cli-dist@${YARN_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, nightly-2026-09-04 for branch coverage
        with:
          toolchain: ${{ env.RUST_COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - run: cargo build --locked --release
      - name: Run complete configured static/orchestration/evidence gate
        run: scripts/self-gate.sh

  release-contract:
    name: Release and installer contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tests/release_contract.test.mjs
      - run: node tests/release_contract.install.test.mjs
      - run: node tests/release_contract.package.test.mjs
      - run: node tests/release_contract.abi.test.mjs

  quality:
    name: CI quality aggregate
    if: ${{ always() }}
    needs: [rust, npm-wrapper, hardgate-self, release-contract]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every quality job to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - run: echo "all required CI gates passed"
