name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.98.1
  RUST_MSRV: 1.90.0
  RUST_COVERAGE_TOOLCHAIN: nightly-2026-09-04
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_LLVM_COV_VERSION: 0.9.0
  CARGO_MUTANTS_VERSION: 27.1.0
  HARDGATE_REQUIRE_PREINSTALLED_CARGO_TOOLS: "1"
  NODE_VERSION: 26.8.1
  # npm/hardgate/package.json declares engines.node >=18; keep that floor in CI.
  NODE_MIN_VERSION: 18.0.0
  NPM_VERSION: 12.0.2
  PNPM_VERSION: 11.25.0

jobs:
  rust:
    name: Rust format, lint, tests, and audit
    runs-on: ubuntu-24.04
    outputs:
      distribution: ${{ steps.scope.outputs.distribution }}
      native_artifact_id: ${{ steps.upload_native.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      - id: scope
        name: Select distribution checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          distribution=true
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if ! printf '%s\n' "$changed" | grep -Eq '^(Cargo\.(toml|lock)|build\.rs|rust-toolchain\.toml|package\.json|\.nvmrc|npm/|scripts/|\.github/|tests/(release_contract|packed_consumer|npm|native_|portable_|repository_rules))'; then
              distribution=false
            fi
          fi
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
      - name: Install pinned prebuilt cargo-audit
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
          fallback: none
      - name: Start the runner resource manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
      - run: cargo fmt --all --check
      - run: scripts/with-resource-limits.sh cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: scripts/with-resource-limits.sh cargo test --all-targets --all-features --locked --no-fail-fast
      - name: Install the minimum supported Rust compiler
        run: rustup toolchain install "$RUST_MSRV" --profile minimal
      - name: Test locked dependencies and all targets on the MSRV
        run: scripts/with-resource-limits.sh cargo "+${RUST_MSRV}" test --all-targets --all-features --locked --no-fail-fast
      - name: Resource boundary and supervisor concurrency regressions
        run: |
          node tests/resource_boundary.test.mjs
          node tests/resource_scope.test.mjs
          node tests/resource_concurrency.test.mjs
      - name: RustSec dependency audit
        run: scripts/dependency-audit.sh
      - if: steps.scope.outputs.distribution == 'true'
        name: Validate the crates.io package without publishing
        run: scripts/with-resource-limits.sh cargo publish --dry-run --locked
      - if: steps.scope.outputs.distribution == 'true'
        name: Build the shared native release binary
        run: scripts/with-resource-limits.sh cargo build --locked --release
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: 0
      - if: steps.scope.outputs.distribution != 'true'
        name: Reuse the tested debug binary for PR integration checks
        run: |
          mkdir -p target/release
          cp target/debug/hardgate target/release/hardgate
      - id: upload_native
        name: Upload the shared native release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64-attempt-${{ github.run_attempt }}
          path: target/release/hardgate
          if-no-files-found: error
          retention-days: 30

  native:
    name: Native local analysis (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: hardgate }
          - { os: macos-15-intel, target: x86_64-apple-darwin, binary: hardgate }
          - { os: macos-15, target: aarch64-apple-darwin, binary: hardgate }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Test local analysis with the MSRV
        run: |
          rustup toolchain install "$RUST_MSRV" --profile minimal
          cargo "+${RUST_MSRV}" test --locked --test portable_analysis_tests --test cli_process_contract --test orchestration_timeout --test engine_boundary_coverage --test execution_contract
      - name: Lint and build with the pinned compiler
        run: |
          cargo clippy --locked --lib --bin hardgate -- -D warnings
          cargo build --locked --release --target ${{ matrix.target }}
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: 0
      - name: Install packed npm binaries and exercise local analysis without Rust
        run: node tests/native_installation.test.mjs target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  npm-wrapper:
    name: npm quality, wrapper, and SBOM regression
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Download the shared native release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.rust.outputs.native_artifact_id }}
          path: target/release
          digest-mismatch: error
      - name: Start the runner resource manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
      - run: chmod 755 target/release/hardgate
      - run: node scripts/sync-npm-version.mjs --check
      - run: node scripts/check-npm-quality.mjs
      - run: node tests/npm-wrapper.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/npm-wrapper-regression.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/consumer_matrix.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - if: needs.rust.outputs.distribution == 'true'
        run: node tests/packed_consumers.test.mjs
      # The real SBOM generator needs both pinned Node and Cargo, which this
      # job already provisions without another runner/toolchain setup.
      - if: needs.rust.outputs.distribution == 'true'
        run: node tests/release_contract.sbom.test.mjs

  npm-wrapper-minimum:
    name: npm wrapper minimum Node compatibility
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_MIN_VERSION }}
      - name: Download the shared native release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.rust.outputs.native_artifact_id }}
          path: target/release
          digest-mismatch: error
      - name: Start the runner resource manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
      - run: chmod 755 target/release/hardgate
      - run: node --version
      - run: node scripts/sync-npm-version.mjs --check
      - run: node tests/npm-wrapper.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/npm-wrapper-regression.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate

  repository-rules:
    name: Repository rules proposal contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --check scripts/verify-repository-rules.mjs
      - run: node scripts/verify-repository-rules.mjs
      - run: node tests/repository_rules.test.mjs

  hardgate-self:
    name: Hardgate complete self/evidence gate
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, nightly-2026-09-04 for branch coverage
        with:
          toolchain: ${{ env.RUST_COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install pinned prebuilt cargo-llvm-cov
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
          fallback: none
      - name: Download the shared native release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.rust.outputs.native_artifact_id }}
          path: target/release
          digest-mismatch: error
      - name: Start the runner resource manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
      - run: chmod 755 target/release/hardgate
      - name: Install pinned cargo-mutants specialist
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-mutants@${{ env.CARGO_MUTANTS_VERSION }}
          fallback: none
      - name: Run complete configured static/orchestration/evidence gate
        run: scripts/self-gate.sh
      - name: Preserve evidence for coverage diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-evidence-attempt-${{ github.run_attempt }}
          path: .hardgate/evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release-contract:
    name: Distribution safety contract
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: needs.rust.outputs.distribution == 'true'
        run: node tests/release_contract.test.mjs
      - if: needs.rust.outputs.distribution == 'true'
        run: node tests/release_contract.package.test.mjs
      - if: needs.rust.outputs.distribution == 'true'
        run: node tests/release_contract.abi.test.mjs

  quality:
    name: CI quality aggregate
    if: ${{ always() }}
    needs: [rust, native, npm-wrapper, npm-wrapper-minimum, repository-rules, hardgate-self, release-contract]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every quality job to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - run: echo "all required CI gates passed"
