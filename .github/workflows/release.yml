          archive_sha=$(tar xOf "dist/${MATRIX_PACKAGE}.tar.gz" "${MATRIX_PACKAGE}/hardgate" | sha256sum | awk '{print $1}')
          installed_sha=$(sha256sum "$install_root/hardgate" | awk '{print $1}')
