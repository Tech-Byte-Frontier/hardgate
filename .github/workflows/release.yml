name: Release

# Tag-driven releases. Single source of truth for the version is
# `Cargo.toml [package] version` (currently 0.3.3).
#
#   git tag v0.3.3 && git push origin v0.3.3
#
# produces, in order:
#   1. prebuilt binaries on GitHub Releases (+ shell/powershell/homebrew
#      installers via `cargo dist build` for local repro -- see Cargo.toml
#      [package.metadata.dist]),
#   2. `cargo publish` to crates.io,
#   3. `npm publish` of `hardgate` + `hardgate-<platform>` packages from npm/.
#
# npm auth: set `NPM_TOKEN` repo secret (automation token). crates.io auth:
# set `CARGO_REGISTRY_TOKEN` repo secret.

permissions:
  contents: write
  id-token: write # npm provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish from, e.g. v0.3.2"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  APP_NAME: hardgate
  # Must match Cargo.toml [package] version. Bumped via `cargo set-version`.
  APP_VERSION: "0.3.3"

jobs:
  # -- tag guard: refuse to publish if Cargo.toml version != tag version --
  version-check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "Cargo.toml version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.tag || github.ref_name }}" != "v$VER" ]; then
            echo "::error::Tag '${{ inputs.tag || github.ref_name }}' != 'v$VER' from Cargo.toml. Bump with 'cargo set-version X.Y.Z', sync npm, then tag."
            exit 1
          fi
          if [ "$VER" != "$APP_VERSION" ]; then
            echo "::error::Cargo.toml $VER != workflow env APP_VERSION $APP_VERSION. Update the env value."
            exit 1
          fi

  # -- cross-platform builds (explicit matrix: transparent, cacheable) --
  build:
    needs: [version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            npm_pkg: hardgate-linux-x64
            ext: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            npm_pkg: hardgate-linux-x64-musl
            ext: ""
            install_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            npm_pkg: hardgate-linux-arm64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            npm_pkg: hardgate-linux-arm64-musl
            ext: ""
            install_musl: true
          - os: macos-14
            target: x86_64-apple-darwin
            npm_pkg: hardgate-darwin-x64
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            npm_pkg: hardgate-darwin-arm64
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            npm_pkg: hardgate-win32-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.install_musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: stage artifact
        shell: bash
        run: |
          STAGE="dist/${{ matrix.npm_pkg }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/hardgate${{ matrix.ext }}" "$STAGE/"
          chmod +x "$STAGE/hardgate${{ matrix.ext }}" 2>/dev/null || true
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          (cd dist && tar czf "${{ matrix.npm_pkg }}.tar.gz" "${{ matrix.npm_pkg }}")
          ls -lh "dist/${{ matrix.npm_pkg }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: dist/${{ matrix.npm_pkg }}.tar.gz
          if-no-files-found: error

  # -- GitHub Release with checksums --
  github-release:
    needs: [version-check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
          # Rename to cargo-dist-style triples for the shell installer story:
          # hardgate-<version>-<target>.tar.gz
          for f in hardgate-*.tar.gz; do echo "$f"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  # -- crates.io (idempotent: skips when the version is already live) --
  publish-crates:
    needs: [version-check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: publish crate unless already live
        # Attempt-first: `cargo search` output is version-format fragile, so
        # publish and tolerate only the known already-live error loudly.
        run: |
          set +e
          OUT=$(cargo publish --locked 2>&1)
          RC=$?
          echo "$OUT" | tail -5
          if [ $RC -ne 0 ]; then
            if echo "$OUT" | grep -qE "already exists on crates.io|already uploaded"; then
              echo "hardgate already live on crates.io; skipping."
            else
              exit $RC
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # -- npm (JS world): hardgate + hardgate-<platform> --
  publish-npm:
    needs: [version-check, build, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/hg-dist
          merge-multiple: true
      - name: populate platform binaries
        run: |
          node scripts/sync-npm-version.mjs
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64 hardgate-win32-x64; do
            mkdir -p "npm/$pkg/bin"
            tar xzf "/tmp/hg-dist/$pkg.tar.gz" -C /tmp/hg-dist
            if [ "$pkg" = "hardgate-win32-x64" ]; then
              cp "/tmp/hg-dist/$pkg/hardgate.exe" "npm/$pkg/bin/hardgate.exe"
            else
              cp "/tmp/hg-dist/$pkg/hardgate" "npm/$pkg/bin/hardgate"
              chmod +x "npm/$pkg/bin/hardgate"
            fi
            ls -lh "npm/$pkg/bin/"
          done
          node tests/npm-wrapper.test.mjs
      # NOTE: the "./" prefix is load-bearing: a bare `npm/<pkg>` arg is
      # parsed as a GitHub `owner/repo` shorthand (git ls-remote failure),
      # not as a local path.
      - name: publish platform packages (skip versions already live)
        run: |
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64 hardgate-win32-x64; do
            WANT=$(node -p "require('./npm/$pkg/package.json').version")
            HAVE=$(npm view "$pkg" version 2>/dev/null || echo none)
            if [ "$HAVE" = "$WANT" ]; then
              echo "$pkg $WANT already on npm; skipping."
            else
              npm publish --provenance --access public "./npm/$pkg"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish main wrapper (skip version already live)
        run: |
          WANT=$(node -p "require('./npm/hardgate/package.json').version")
          HAVE=$(npm view hardgate version 2>/dev/null || echo none)
          if [ "$HAVE" = "$WANT" ]; then
            echo "hardgate $WANT already on npm; skipping."
          else
            npm publish --provenance --access public ./npm/hardgate
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
