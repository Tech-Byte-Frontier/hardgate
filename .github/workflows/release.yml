name: Release

# A release is an immutable, tag-addressed transaction. Every publication job
# waits for the same quality gate and for the verified six-archive bundle.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag to publish
        required: true
        type: string

concurrency:
  group: hardgate-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.85.1
  CARGO_AUDIT_VERSION: 0.21.2
  CARGO_LLVM_COV_VERSION: 0.9.0
  NODE_VERSION: 22.22.2

jobs:
  version-check:
    name: Validate tag and every version source
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: Derive version from tag and validate sources
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          test "$tag_commit" = "$head_commit"
          if [ "$EVENT_NAME" = push ]; then test "$tag_commit" = "$GITHUB_SHA"; fi
          version=$(node scripts/release-version.mjs --tag "$RELEASE_TAG")
          node scripts/sync-npm-version.mjs --check --tag "$RELEASE_TAG"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "commit=$tag_commit"
          } >> "$GITHUB_OUTPUT"
          echo "release $RELEASE_TAG ($version) at $tag_commit"

  quality-gate:
    name: Required release quality gate
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1, Rust 1.85.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: RustSec dependency audit
        run: scripts/dependency-audit.sh
      - run: cargo build --locked --release
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ needs.version-check.outputs.commit }}
      - run: node scripts/sync-npm-version.mjs --check --tag "${{ needs.version-check.outputs.tag }}"
      - run: node scripts/check-npm-quality.mjs
      - run: node tests/npm-wrapper.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/npm-wrapper-regression.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node scripts/check-consumer-matrix.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/release_contract.test.mjs
      - name: Hardgate complete configured self/orchestration/evidence gate
        run: scripts/self-gate.sh

  build:
    name: Build ${{ matrix.target }}
    needs: [version-check, quality-gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1, Rust 1.85.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - if: matrix.musl == true
        name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build reproducible binary
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then export CC_x86_64_unknown_linux_musl=musl-gcc; fi
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then export CC_aarch64_unknown_linux_musl=musl-gcc; fi
          SOURCE_DATE_EPOCH=0 cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke-test version, commit, and architecture
        env:
          EXPECTED_VERSION: ${{ needs.version-check.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/hardgate"
          test -x "$binary"
          target_arch=$(printf '%s' "${{ matrix.target }}" | cut -d- -f1)
          host_arch=$(uname -m)
          case "$target_arch:$host_arch" in
            x86_64:x86_64|x86_64:amd64|aarch64:aarch64|aarch64:arm64)
              test "$("$binary" --version)" = "hardgate ${EXPECTED_VERSION} (${EXPECTED_COMMIT})" ;;
            *) echo "cross-architecture target; version smoke deferred to archive metadata" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-*) file "$binary" | grep -E 'x86-64|x86_64' ;;
            aarch64-unknown-*) file "$binary" | grep -E 'ARM aarch64|arm64' ;;
            x86_64-apple-*) file "$binary" | grep -E 'x86_64' ;;
            aarch64-apple-*) file "$binary" | grep -E 'arm64' ;;
          esac
      - name: Upload raw binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hardgate
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package and verify release artifacts
    needs: [version-check, quality-gate, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1, Rust 1.85.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-binaries
      - name: Create deterministic archives and SBOM
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-package.mjs --incoming build-binaries --output dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
          node scripts/release-sbom.mjs --output "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json"
      - name: Verify every archive and checksum before publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Sign archive checksums with GitHub artifact attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Sign archive SBOM with GitHub artifact attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/hardgate-${{ needs.version-check.outputs.version }}.sbom.cdx.json

  github-release:
    name: Publish verified GitHub Release
    needs: [version-check, quality-gate, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Recheck checksums immediately before publication
        run: cd dist && sha256sum --check --strict SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/*.sbom.cdx.json --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/*.sbom.cdx.json --verify-tag --generate-notes
          fi

  publish-crates:
    name: Publish verified crate
    needs: [version-check, quality-gate, package, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1, Rust 1.85.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Verify exact crates.io version
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          api="https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}"
          for attempt in $(seq 1 20); do
            if body=$(curl --fail --location --silent --show-error "$api"); then
              actual=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])')
              test "$actual" = "$RELEASE_VERSION"
              echo "hardgate@$actual verified on crates.io"
              exit 0
            fi
            sleep 10
          done
          echo "crates.io did not expose hardgate@$RELEASE_VERSION" >&2
          exit 1

  publish-npm:
    name: Publish platform packages, then wrapper
    needs: [version-check, quality-gate, package, github-release, publish-crates]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Verify release bundle and prepare npm packages
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/sync-npm-version.mjs --check --tag "$RELEASE_TAG"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            mkdir -p "npm/$pkg/bin"
            tar xOf "dist/$pkg.tar.gz" "$pkg/hardgate" > "npm/$pkg/bin/hardgate"
            chmod 755 "npm/$pkg/bin/hardgate"
            cp README.md LICENSE-MIT LICENSE-APACHE "npm/$pkg/"
            (cd "npm/$pkg" && npm pack --dry-run --json >/dev/null)
          done
          cp LICENSE-MIT LICENSE-APACHE npm/hardgate/
          (cd npm/hardgate && npm pack --dry-run --json >/dev/null)
      - name: Publish and verify each platform package in order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          registry_version() { npm view "$1@$2" version 2>/dev/null; }
          publish_platform() {
            pkg="$1"
            wanted=$(node -p "require('./npm/$pkg/package.json').version")
            current=""
            if current=$(registry_version "$pkg" "$wanted"); then
              test "$current" = "$wanted"
              echo "$pkg@$wanted already verified on npm"
            else
              npm publish --provenance --access public "./npm/$pkg"
              test "$(registry_version "$pkg" "$wanted")" = "$wanted"
              echo "$pkg@$wanted published and exact-version verified"
            fi
          }
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            publish_platform "$pkg"
          done
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            wanted=$(node -p "require('./npm/$pkg/package.json').version")
            test "$(registry_version "$pkg" "$wanted")" = "$wanted"
          done
      - name: Publish wrapper only after all platforms are verified
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          wanted=$(node -p "require('./npm/hardgate/package.json').version")
          current=""
          if current=$(npm view "@tech-byte-frontier/hardgate@$wanted" version 2>/dev/null); then
            test "$current" = "$wanted"
          else
            npm publish --provenance --access public ./npm/hardgate
          fi
          test "$(npm view "@tech-byte-frontier/hardgate@$wanted" version)" = "$wanted"
          echo "@tech-byte-frontier/hardgate@$wanted published and exact-version verified"

  verify-channels:
    name: Verify all published channels
    needs: [version-check, github-release, publish-crates, publish-npm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify release assets, crates.io, and all npm versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          release_tag=$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)
          test "$release_tag" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS
          crate_version=$(curl --fail --location --silent "https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])')
          test "$crate_version" = "$RELEASE_VERSION"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            test "$(npm view "$pkg@$RELEASE_VERSION" version)" = "$RELEASE_VERSION"
          done
          test "$(npm view "@tech-byte-frontier/hardgate@$RELEASE_VERSION" version)" = "$RELEASE_VERSION"
          echo "all release channels verified at $RELEASE_VERSION"
