name: Release

# A release is an immutable, tag-addressed transaction. Every publication job
# waits for the same quality gate and for the verified six-archive bundle.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag to publish
        required: true
        type: string

concurrency:
  # Registry latest tags are process-global, so different release tags must
  # never publish concurrently.
  group: hardgate-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  RUST_COVERAGE_TOOLCHAIN: nightly-2026-09-04
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_LLVM_COV_VERSION: 0.9.0
  NODE_VERSION: 26.8.1
  NPM_VERSION: 12.0.2
  PNPM_VERSION: 11.25.0
  YARN_VERSION: 4.18.0
  BUN_VERSION: 1.4.0
  HARDGATE_CURL_CONNECT_TIMEOUT: 10
  HARDGATE_CURL_MAX_TIME: 20
  # Ten attempts at most 20s each plus nine 10s delays keeps one registry
  # wait below five minutes while allowing normal eventual-consistency lag.
  HARDGATE_REGISTRY_ATTEMPTS: 10
  HARDGATE_REGISTRY_DELAY: 10

jobs:
  version-check:
    name: Validate tag and every version source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: Derive version from tag and validate sources
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          test "$tag_commit" = "$head_commit"
          if [ "$EVENT_NAME" = push ]; then test "$tag_commit" = "$GITHUB_SHA"; fi
          version=$(node scripts/release-version.mjs --tag "$RELEASE_TAG")
          node scripts/sync-npm-version.mjs --check --tag "$RELEASE_TAG"

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_commit=$(git rev-parse refs/remotes/origin/main)
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "release tag must point at the exact origin/main tip ($main_commit), not $tag_commit" >&2
            exit 1
          fi

          ci_runs=$(mktemp)
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$tag_commit" \
            -f per_page=1 > "$ci_runs"
          if ! jq -e --arg sha "$tag_commit" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$ci_runs" >/dev/null; then
            echo "release commit has no completed successful main CI run: $tag_commit" >&2
            rm -f "$ci_runs"
            exit 1
          fi
          rm -f "$ci_runs"

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "commit=$tag_commit"
          } >> "$GITHUB_OUTPUT"
          echo "release $RELEASE_TAG ($version) at $tag_commit"

  quality-gate:
    name: Required release quality gate
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" "@yarnpkg/cli-dist@${YARN_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, nightly-2026-09-04 for branch coverage
        with:
          toolchain: ${{ env.RUST_COVERAGE_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: RustSec dependency audit
        run: scripts/dependency-audit.sh
      - run: cargo build --locked --release
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ needs.version-check.outputs.commit }}
      - name: Validate the crates.io package without publishing
        run: cargo publish --dry-run --locked
      - run: node scripts/sync-npm-version.mjs --check --tag "${{ needs.version-check.outputs.tag }}"
      - run: node scripts/check-npm-quality.mjs
      - run: node tests/npm-wrapper.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/npm-wrapper-regression.test.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/consumer_matrix.mjs
        env:
          HARDGATE_BINARY: target/release/hardgate
      - run: node tests/release_contract.test.mjs
      - run: node tests/release_contract.install.test.mjs
      - run: node tests/release_contract.package.test.mjs
      - run: node tests/release_contract.abi.test.mjs
      - name: Hardgate complete configured self/orchestration/evidence gate
        run: scripts/self-gate.sh

  build:
    name: Build ${{ matrix.target }}
    needs: [version-check, quality-gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - if: matrix.musl == true
        name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build reproducible binary
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then export CC_x86_64_unknown_linux_musl=musl-gcc; fi
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then export CC_aarch64_unknown_linux_musl=musl-gcc; fi
          SOURCE_DATE_EPOCH=0 cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke-test version, commit, and architecture
        env:
          EXPECTED_VERSION: ${{ needs.version-check.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/hardgate"
          test -x "$binary"
          target_arch=$(printf '%s' "${{ matrix.target }}" | cut -d- -f1)
          host_arch=$(uname -m)
          case "$target_arch:$host_arch" in
            x86_64:x86_64|x86_64:amd64|aarch64:aarch64|aarch64:arm64)
              test "$("$binary" --version)" = "hardgate ${EXPECTED_VERSION} (${EXPECTED_COMMIT})" ;;
            *) echo "cross-architecture target; version smoke deferred to archive metadata" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-*) file "$binary" | grep -E 'x86-64|x86_64' ;;
            aarch64-unknown-*) file "$binary" | grep -E 'ARM aarch64|arm64' ;;
            x86_64-apple-*) file "$binary" | grep -E 'x86_64' ;;
            aarch64-apple-*) file "$binary" | grep -E 'arm64' ;;
          esac
      - name: Upload raw binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hardgate
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package and verify release artifacts
    needs: [version-check, quality-gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-binaries
      - name: Create deterministic archives and SBOM
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-package.mjs --incoming build-binaries --output dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
          node scripts/release-sbom.mjs --output "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          node scripts/release-checksums.mjs --dist dist --version "$RELEASE_VERSION"
      - name: Verify every archive and checksum before publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Sign archive checksums with GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Sign archive SBOM with GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/hardgate-${{ needs.version-check.outputs.version }}.sbom.cdx.json

  publication-preflight:
    name: Validate publication prerequisites
    needs: [version-check, quality-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      # Cargo has no non-mutating remote credential check. The quality gate's
      # dry run validates the package; the single publish job performs auth.
      - name: Require the crates.io publication credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is required for crates.io publication" >&2
            exit 1
          fi
      - name: Authenticate the npm publication credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required for npm publication" >&2
            exit 1
          fi
          # This proves registry authentication. Granular write scope and 2FA
          # eligibility are authoritatively checked only by npm publish.
          npm whoami --registry=https://registry.npmjs.org >/dev/null

  github-release:
    name: Publish verified GitHub Release
    needs: [version-check, quality-gate, package, publication-preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Recheck checksums immediately before publication
        run: cd dist && sha256sum --check --strict SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            hardgate-linux-x64.tar.gz
            hardgate-linux-x64-musl.tar.gz
            hardgate-linux-arm64.tar.gz
            hardgate-linux-arm64-musl.tar.gz
            hardgate-darwin-x64.tar.gz
            hardgate-darwin-arm64.tar.gz
            SHA256SUMS
            "hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          )
          release_error=$(mktemp)
          release_metadata=""
          if release_metadata=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease 2>"$release_error"); then
            release_exists=1
          else
            status=$?
            # gh exits 1 for both a missing release and API failures, so only
            # an explicit not-found response may take the create path.
            if [ "$status" -eq 1 ] && grep -Eiq 'release[[:space:]]+not found|HTTP[[:space:]]+404|404[[:space:]]+Not Found' "$release_error"; then
              release_exists=0
            else
              cat "$release_error" >&2
              rm -f "$release_error"
              echo "unable to determine whether GitHub release $RELEASE_TAG exists; refusing to create or mutate it" >&2
              exit 1
            fi
          fi
          rm -f "$release_error"
          if [ "$release_exists" -eq 1 ]; then
            release_tag=$(printf '%s\n' "$release_metadata" | jq -r '.tagName')
            release_is_draft=$(printf '%s\n' "$release_metadata" | jq -r '.isDraft')
            release_is_prerelease=$(printf '%s\n' "$release_metadata" | jq -r '.isPrerelease')
            test "$release_tag" = "$RELEASE_TAG"
            if ! test "$release_is_draft" = false; then
              echo "existing GitHub release $RELEASE_TAG is a draft; refusing to mutate it" >&2
              exit 1
            fi
            if ! test "$release_is_prerelease" = false; then
              echo "existing GitHub release $RELEASE_TAG is a prerelease; refusing to mutate it" >&2
              exit 1
            fi
            existing=$(mktemp -d)
            trap 'rm -rf "$existing"' EXIT
            asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for existing_name in $asset_names; do
              case " ${assets[*]} " in
                *" $existing_name "*) ;;
                *) echo "unexpected immutable release asset: $existing_name" >&2; exit 1 ;;
              esac
            done
            for asset in "${assets[@]}"; do
              if printf '%s\n' "$asset_names" | grep -Fqx "$asset"; then
                gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$existing"
                cmp -- "dist/$asset" "$existing/$asset"
              else
                gh release upload "$RELEASE_TAG" "dist/$asset"
              fi
            done
          elif [ "$release_exists" -eq 0 ]; then
            paths=()
            for asset in "${assets[@]}"; do paths+=("dist/$asset"); done
            gh release create "$RELEASE_TAG" "${paths[@]}" --verify-tag --generate-notes
          else
            echo "unknown GitHub release existence state; refusing to publish" >&2
            exit 1
          fi

  publish-crates:
    name: Publish verified crate
    needs: [version-check, quality-gate, package, github-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - id: crate-state
        name: Check crate publication state
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          api="https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}"
          crate_probe() {
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "$api") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          crate_version() {
            retry_absent="$1"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(crate_probe); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          already_published=0
          if current=$(crate_version 0); then
            test "$current" = "$RELEASE_VERSION"
            already_published=1
            echo "hardgate@$current already verified on crates.io"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "crates.io version probe failed; refusing to publish" >&2
              exit "$status"
            fi
          fi
          if [ "$already_published" -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crate-state.outputs.publish == 'true'
        name: Publish crate when exact version is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_token="${CARGO_REGISTRY_TOKEN:?CARGO_REGISTRY_TOKEN is required}"
          unset CARGO_REGISTRY_TOKEN
          CARGO_REGISTRY_TOKEN="$publish_token" cargo publish --locked
          unset publish_token
      - name: Verify published crate identity without publish credentials
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          api="https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}"
          crate_probe() {
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "$api") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          crate_version() {
            retry_absent="$1"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(crate_probe); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          actual=$(crate_version 1) || {
            status=$?
            echo "crates.io exact-version verification failed with status $status" >&2
            exit "$status"
          }
          test "$actual" = "$RELEASE_VERSION"
          echo "hardgate@$actual verified on crates.io"
          crate_root=$(mktemp -d)
          crate_installed=0
          for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
            if cargo install hardgate --version "=$RELEASE_VERSION" --locked --force --root "$crate_root"; then
              crate_installed=1
              break
            fi
            [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
          done
          test "$crate_installed" -eq 1
          test -x "$crate_root/bin/hardgate"
          test "$("$crate_root/bin/hardgate" --version)" = "hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"

  publish-npm:
    name: Publish platform packages, then wrapper
    needs: [version-check, quality-gate, package, github-release, publish-crates]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Verify release bundle and prepare npm packages
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/sync-npm-version.mjs --check --tag "$RELEASE_TAG"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            mkdir -p "npm/$pkg/bin"
            tar xOf "dist/$pkg.tar.gz" "$pkg/hardgate" > "npm/$pkg/bin/hardgate"
            chmod 755 "npm/$pkg/bin/hardgate"
            cp LICENSE-MIT LICENSE-APACHE "npm/$pkg/"
            (cd "npm/$pkg" && npm pack --dry-run --json >/dev/null)
          done
          cp LICENSE-MIT LICENSE-APACHE npm/hardgate/
          (cd npm/hardgate && npm pack --dry-run --json >/dev/null)
      - name: Publish and verify each platform package in order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          publish_token="${NODE_AUTH_TOKEN:?NPM_TOKEN is required for npm publication}"
          # Keep the token out of probes, package verification, and helper
          # processes. It is reintroduced only for the single npm publish
          # process that needs it.
          unset NODE_AUTH_TOKEN
          npm_registry_probe() {
            name="$1"
            wanted="$2"
            encoded_name=$(printf '%s' "$name" | sed 's|/|%2f|g')
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}/${wanted}") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          wait_for_registry_version() {
            retry_absent="$1"
            shift
            name="$1"
            wanted="$2"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(npm_registry_probe "$name" "$wanted"); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          publish_platform() {
            pkg="$1"
            wanted=$(node -p "require('./npm/$pkg/package.json').version")
            current=""
            if current=$(wait_for_registry_version 0 "$pkg" "$wanted"); then
              test "$current" = "$wanted"
              echo "$pkg@$wanted already verified on npm"
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "npm registry version probe failed for $pkg@$wanted; refusing to publish" >&2
                return "$status"
              fi
              NODE_AUTH_TOKEN="$publish_token" npm publish --provenance --access public "./npm/$pkg"
              current=$(wait_for_registry_version 1 "$pkg" "$wanted")
              test "$current" = "$wanted"
              echo "$pkg@$wanted published and exact-version verified"
            fi
          }
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            publish_platform "$pkg"
            env -u NODE_AUTH_TOKEN node scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist --platform-only --package "$pkg"
          done
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            wanted=$(node -p "require('./npm/$pkg/package.json').version")
            test "$(wait_for_registry_version 0 "$pkg" "$wanted")" = "$wanted"
          done
          env -u NODE_AUTH_TOKEN node scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist --platform-only
          unset publish_token
      - name: Publish wrapper only after all platforms are verified
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          publish_token="${NODE_AUTH_TOKEN:?NPM_TOKEN is required for npm publication}"
          unset NODE_AUTH_TOKEN
          wanted=$(node -p "require('./npm/hardgate/package.json').version")
          current=""
          npm_registry_probe() {
            encoded_name=$(printf '%s' "$1" | sed 's|/|%2f|g')
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}/$2") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          wait_for_registry_version() {
            retry_absent="$1"
            shift
            name="$1"
            wanted="$2"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(npm_registry_probe "$name" "$wanted"); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          if current=$(wait_for_registry_version 0 "@tech-byte-frontier/hardgate" "$wanted"); then
            test "$current" = "$wanted"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "npm registry version probe failed for @tech-byte-frontier/hardgate@$wanted; refusing to publish" >&2
              exit "$status"
            fi
            NODE_AUTH_TOKEN="$publish_token" npm publish --provenance --access public ./npm/hardgate
          fi
          test "$(wait_for_registry_version 1 "@tech-byte-frontier/hardgate" "$wanted")" = "$wanted"
          env -u NODE_AUTH_TOKEN node scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist
          unset publish_token
          echo "@tech-byte-frontier/hardgate@$wanted published and exact-version verified"

  verify-channels:
    name: Verify all published channels
    needs: [version-check, github-release, publish-crates, publish-npm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" "@yarnpkg/cli-dist@${YARN_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Download and verify the complete release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          release_metadata=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
          release_tag=$(printf '%s\n' "$release_metadata" | jq -r '.tagName')
          release_is_draft=$(printf '%s\n' "$release_metadata" | jq -r '.isDraft')
          release_is_prerelease=$(printf '%s\n' "$release_metadata" | jq -r '.isPrerelease')
          latest_release_tag=$(gh release view --json tagName --jq .tagName)
          test "$release_tag" = "$RELEASE_TAG"
          test "$release_is_draft" = false
          test "$release_is_prerelease" = false
          test "$latest_release_tag" = "$RELEASE_TAG"
          assets=(
            hardgate-linux-x64.tar.gz
            hardgate-linux-x64-musl.tar.gz
            hardgate-linux-arm64.tar.gz
            hardgate-linux-arm64-musl.tar.gz
            hardgate-darwin-x64.tar.gz
            hardgate-darwin-arm64.tar.gz
            SHA256SUMS
            "hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          )
          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)
          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets"
          mkdir -p dist
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir dist
          done
          for asset in "${assets[@]}"; do test -s "dist/$asset"; done
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          node scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist

      - name: Verify published registry versions and runnable installs
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          expected="hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          npm_registry_probe() {
            name="$1"
            wanted="$2"
            encoded_name=$(printf '%s' "$name" | sed 's|/|%2f|g')
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}/${wanted}") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          # The unversioned registry document is authoritative for
          # dist-tags.latest; exact-version probes alone cannot prove the
          # package is the current release channel.
          npm_latest_probe() {
            name="$1"
            encoded_name=$(printf '%s' "$name" | sed 's|/|%2f|g')
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["dist-tags"]["latest"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          wait_for_latest_tag() {
            name="$1"
            wanted="$2"
            status=2
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(npm_latest_probe "$name"); then
                if [ "$actual" = "$wanted" ]; then
                  printf '%s\n' "$actual"
                  return 0
                fi
                echo "npm dist-tags.latest for $name is $actual; expected $wanted" >&2
                status=4
              else
                status=$?
                case "$status" in
                  1|2) ;;
                  *) return "$status" ;;
                esac
              fi
              [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
            done
            return "$status"
          }
          wait_for_registry_version() {
            retry_absent="$1"
            name="$2"
            wanted="$3"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(npm_registry_probe "$name" "$wanted"); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          crate_probe() {
            api="https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}"
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "$api") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          wait_for_crate_version() {
            retry_absent="$1"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(crate_probe); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          test "$(wait_for_crate_version 1)" = "$RELEASE_VERSION"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            test "$(wait_for_registry_version 1 "$pkg" "$RELEASE_VERSION")" = "$RELEASE_VERSION"
            test "$(wait_for_latest_tag "$pkg" "$RELEASE_VERSION")" = "$RELEASE_VERSION"
          done
          test "$(wait_for_registry_version 1 "@tech-byte-frontier/hardgate" "$RELEASE_VERSION")" = "$RELEASE_VERSION"
          test "$(wait_for_latest_tag "@tech-byte-frontier/hardgate" "$RELEASE_VERSION")" = "$RELEASE_VERSION"

          crate_root=$(mktemp -d)
          crate_installed=0
          for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
            if cargo install hardgate --version "=$RELEASE_VERSION" --locked --force --root "$crate_root"; then
              crate_installed=1
              break
            fi
            [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
          done
          test "$crate_installed" -eq 1
          test -x "$crate_root/bin/hardgate"
          test "$("$crate_root/bin/hardgate" --version)" = "$expected"

          npm_root=$(mktemp -d)
          npm init --yes --prefix "$npm_root" >/dev/null
          npm_installed=0
          for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
            if npm install --ignore-scripts --no-audit --no-fund --prefix "$npm_root" "@tech-byte-frontier/hardgate@${RELEASE_VERSION}"; then
              npm_installed=1
              break
            fi
            [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
          done
          test "$npm_installed" -eq 1
          npm_binary="$npm_root/node_modules/.bin/hardgate"
          test -x "$npm_binary"
          test "$("$npm_binary" --version)" = "$expected"

      - name: Verify clean npm, pnpm, Yarn, and Bun consumers
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
          PNPM_VERSION: ${{ env.PNPM_VERSION }}
          YARN_VERSION: ${{ env.YARN_VERSION }}
          BUN_VERSION: ${{ env.BUN_VERSION }}
          NPM_VERSION: ${{ env.NPM_VERSION }}
        run: |
          set -euo pipefail
          expected="hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          test "$(yarn --version)" = "$YARN_VERSION"
          test "$(bun --version)" = "$BUN_VERSION"

          pnpm_project=$(mktemp -d)
          npm init --yes --prefix "$pnpm_project" >/dev/null
          (cd "$pnpm_project" && pnpm add --ignore-scripts "@tech-byte-frontier/hardgate@${RELEASE_VERSION}")
          test "$($pnpm_project/node_modules/.bin/hardgate --version)" = "$expected"

          yarn_project=$(mktemp -d)
          npm init --yes --prefix "$yarn_project" >/dev/null
          printf '%s\n' 'nodeLinker: node-modules' > "$yarn_project/.yarnrc.yml"
          (cd "$yarn_project" && yarn add "@tech-byte-frontier/hardgate@${RELEASE_VERSION}")
          test "$($yarn_project/node_modules/.bin/hardgate --version)" = "$expected"

          bun_project=$(mktemp -d)
          npm init --yes --prefix "$bun_project" >/dev/null
          (cd "$bun_project" && bun add "@tech-byte-frontier/hardgate@${RELEASE_VERSION}")
          test "$($bun_project/node_modules/.bin/hardgate --version)" = "$expected"

      - name: Exercise the documented shell installer
        env:
          HARDGATE_VERSION: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          install_root=$(mktemp -d)
          HARDGATE_INSTALL_DIR="$install_root" sh scripts/install.sh
          test -x "$install_root/hardgate"
          test "$("$install_root/hardgate" --version)" = "hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
