name: Release

# A release uses an immutable signed source and verified archive bundle.
# Registry staging, default promotion, and consumer verification are separate
# checkpoints; publication across registries is not atomic.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag to publish
        required: true
        type: string
      resume_run_id:
        description: Prior release run whose verified bundle should be reused
        required: false
        type: string

concurrency:
  # Registry latest tags are process-global, so different release tags must
  # never publish concurrently.
  group: hardgate-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  NODE_VERSION: 26.8.1
  NPM_VERSION: 12.0.2
  # Explicit repository setting; token mode remains the migration default.
  HARDGATE_NPM_AUTH_MODE: ${{ vars.NPM_PUBLISH_AUTH_MODE || 'token' }}
  PNPM_VERSION: 11.25.0
  YARN_VERSION: 4.18.0
  BUN_VERSION: 1.4.0
  HARDGATE_CURL_CONNECT_TIMEOUT: 10
  HARDGATE_CURL_MAX_TIME: 20
  # Ten attempts at most 20s each plus nine 10s delays keeps one registry
  # wait below five minutes while allowing normal eventual-consistency lag.
  HARDGATE_REGISTRY_ATTEMPTS: 10
  HARDGATE_REGISTRY_DELAY: 10
  # npm may accept a provenance-backed upload and explicitly process it for
  # several minutes before the exact-version endpoint becomes visible. The
  # 580s deadline plus one at-most-20s in-flight probe caps this at ten minutes.
  HARDGATE_NPM_VISIBILITY_TIMEOUT_SECONDS: 580
  HARDGATE_CRATES_IO_USER_AGENT: "hardgate-release (https://github.com/Tech-Byte-Frontier/hardgate)"

jobs:
  version-check:
    name: Validate tag and every version source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      resume: ${{ steps.version.outputs.resume }}
      resume_artifact_id: ${{ steps.version.outputs.resume_artifact_id }}
      ci_run_id: ${{ steps.version.outputs.ci_run_id }}
      ci_native_artifact_id: ${{ steps.version.outputs.ci_native_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: Derive version from tag and validate sources
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          test "$tag_commit" = "$head_commit"
          if [ "$EVENT_NAME" = push ]; then test "$tag_commit" = "$GITHUB_SHA"; fi
          version=$(node scripts/release-version.mjs --tag "$RELEASE_TAG")
          node scripts/sync-npm-version.mjs --check --tag "$RELEASE_TAG"

          resume=false
          resume_artifact_id=""
          if [ -n "$RESUME_RUN_ID" ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "resume_run_id is accepted only for an explicit workflow dispatch" >&2
              exit 1
            fi
            case "$RESUME_RUN_ID" in
              *[!0-9]*|'') echo "resume_run_id must be a numeric GitHub Actions run ID" >&2; exit 1 ;;
            esac
            if [ "$RESUME_RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "a release run cannot resume from itself" >&2
              exit 1
            fi

            source_run=$(mktemp)
            source_jobs=$(mktemp)
            source_artifacts=$(mktemp)
            cleanup_resume_metadata() {
              rm -f "$source_run" "$source_jobs" "$source_artifacts"
            }
            trap cleanup_resume_metadata EXIT
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}" > "$source_run"
            if ! jq -e --arg sha "$tag_commit" --arg tag "$RELEASE_TAG" '
              (.path | split("@")[0]) == ".github/workflows/release.yml" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $sha and
              .head_branch == $tag
            ' "$source_run" >/dev/null; then
              echo "resume source is not a completed tag-triggered release run for $RELEASE_TAG at $tag_commit" >&2
              exit 1
            fi

            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/jobs" \
              -f per_page=100 > "$source_jobs"
            for required_job in \
              "Validate tag and every version source" \
              "Build x86_64-unknown-linux-musl" \
              "Build aarch64-unknown-linux-gnu" \
              "Build aarch64-unknown-linux-musl" \
              "Build x86_64-apple-darwin" \
              "Build aarch64-apple-darwin" \
              "Package and verify release artifacts"
            do
              successful=$(jq --arg name "$required_job" \
                '[.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' \
                "$source_jobs")
              if [ "$successful" -ne 1 ]; then
                echo "resume source lacks exactly one successful prerequisite job: $required_job" >&2
                exit 1
              fi
            done

            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/artifacts" \
              -f per_page=100 > "$source_artifacts"
            artifact_count=$(jq --arg sha "$tag_commit" --argjson run "$RESUME_RUN_ID" '[
              .artifacts[] |
              select(
                .name == "release-bundle" and
                .expired == false and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $sha
              )
            ] | length' "$source_artifacts")
            if [ "$artifact_count" -ne 1 ]; then
              echo "resume source must contain exactly one unexpired release-bundle for $tag_commit" >&2
              exit 1
            fi
            resume_artifact_id=$(jq -r --arg sha "$tag_commit" --argjson run "$RESUME_RUN_ID" '
              .artifacts[] |
              select(
                .name == "release-bundle" and
                .expired == false and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $sha
              ) |
              .id
            ' "$source_artifacts")
            case "$resume_artifact_id" in
              *[!0-9]*|'') echo "resume artifact ID is invalid" >&2; exit 1 ;;
            esac
            resume=true
            cleanup_resume_metadata
            trap - EXIT
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_commit=$(git rev-parse refs/remotes/origin/main)
          if [ "$tag_commit" != "$main_commit" ]; then
            if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
              echo "release tag commit $tag_commit is not an ancestor of origin/main $main_commit" >&2
              exit 1
            fi
            if [ "$resume" != true ] && [ "$RUN_ATTEMPT" -le 1 ]; then
              echo "a first release attempt must point at the exact origin/main tip ($main_commit), not $tag_commit" >&2
              exit 1
            fi
            echo "recovering signed release $RELEASE_TAG after main advanced to $main_commit"
          fi

          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_SHA" != "$main_commit" ]; then
            echo "a release dispatch must run the workflow from the exact origin/main tip $main_commit" >&2
            exit 1
          fi

          if [ "$resume" = true ]; then
            recovery_ci_runs=$(mktemp)
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$main_commit" \
              -f per_page=1 > "$recovery_ci_runs"
            if ! jq -e --arg sha "$main_commit" \
              'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
              "$recovery_ci_runs" >/dev/null; then
              echo "resume workflow commit has no completed successful main CI run: $main_commit" >&2
              rm -f "$recovery_ci_runs"
              exit 1
            fi
            rm -f "$recovery_ci_runs"
          fi

          ci_runs=$(mktemp)
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$tag_commit" \
            -f per_page=1 > "$ci_runs"
          if ! jq -e --arg sha "$tag_commit" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$ci_runs" >/dev/null; then
            echo "release commit has no completed successful main CI run: $tag_commit" >&2
            rm -f "$ci_runs"
            exit 1
          fi
          ci_run_id=$(jq -r --arg sha "$tag_commit" '
            .workflow_runs[] |
            select(.head_sha == $sha and .conclusion == "success") |
            .id
          ' "$ci_runs")
          case "$ci_run_id" in
            *[!0-9]*|'') echo "successful CI run ID is invalid" >&2; rm -f "$ci_runs"; exit 1 ;;
          esac
          rm -f "$ci_runs"

          ci_native_artifact_id=""
          if [ "$resume" != true ]; then
            ci_artifacts=$(mktemp)
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/artifacts" \
              -f per_page=100 > "$ci_artifacts"
            native_count=$(jq --arg sha "$tag_commit" --argjson run "$ci_run_id" '[
              .artifacts[] |
              select(
                (.name | startswith("native-linux-x64-attempt-")) and
                .expired == false and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $sha
              )
            ] | length' "$ci_artifacts")
            if [ "$native_count" -lt 1 ]; then
              echo "successful CI run must contain an unexpired native Linux x64 artifact for $tag_commit" >&2
              rm -f "$ci_artifacts"
              exit 1
            fi
            ci_native_artifact_id=$(jq -r --arg sha "$tag_commit" --argjson run "$ci_run_id" '
              [
                .artifacts[] |
                select(
                  (.name | startswith("native-linux-x64-attempt-")) and
                  .expired == false and
                  .workflow_run.id == $run and
                  .workflow_run.head_sha == $sha
                )
              ] |
              max_by(.id) |
              .id
            ' "$ci_artifacts")
            case "$ci_native_artifact_id" in
              *[!0-9]*|'') echo "CI native artifact ID is invalid" >&2; rm -f "$ci_artifacts"; exit 1 ;;
            esac
            rm -f "$ci_artifacts"
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "commit=$tag_commit"
            echo "resume=$resume"
            echo "resume_artifact_id=$resume_artifact_id"
            echo "ci_run_id=$ci_run_id"
            echo "ci_native_artifact_id=$ci_native_artifact_id"
          } >> "$GITHUB_OUTPUT"
          echo "release $RELEASE_TAG ($version) at $tag_commit"

  build:
    name: Build ${{ matrix.target }}
    needs: [version-check]
    if: needs.version-check.outputs.resume != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - if: matrix.musl == true
        name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build reproducible binary
        env:
          HARDGATE_BUILD_GIT_SHA: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then export CC_x86_64_unknown_linux_musl=musl-gcc; fi
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then export CC_aarch64_unknown_linux_musl=musl-gcc; fi
          SOURCE_DATE_EPOCH=0 cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke-test version, commit, and architecture
        env:
          EXPECTED_VERSION: ${{ needs.version-check.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/hardgate"
          test -x "$binary"
          target_arch=$(printf '%s' "${{ matrix.target }}" | cut -d- -f1)
          host_arch=$(uname -m)
          case "$target_arch:$host_arch" in
            x86_64:x86_64|x86_64:amd64|aarch64:aarch64|aarch64:arm64)
              test "$("$binary" --version)" = "hardgate ${EXPECTED_VERSION} (${EXPECTED_COMMIT})" ;;
            *) echo "cross-architecture target; version smoke deferred to archive metadata" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-*) file "$binary" | grep -E 'x86-64|x86_64' ;;
            aarch64-unknown-*) file "$binary" | grep -E 'ARM aarch64|arm64' ;;
            x86_64-apple-*) file "$binary" | grep -E 'x86_64' ;;
            aarch64-apple-*) file "$binary" | grep -E 'arm64' ;;
          esac
      - name: Upload raw binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hardgate
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and verify release artifacts
    needs: [version-check, build]
    if: >-
      ${{
        always() &&
        needs.version-check.result == 'success' &&
        (
          (
            needs.version-check.outputs.resume == 'true' &&
            needs.build.result == 'skipped'
          ) ||
          (
            needs.version-check.outputs.resume != 'true' &&
            needs.build.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle_artifact_id: ${{ steps.upload_bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - if: needs.version-check.outputs.resume != 'true'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - if: needs.version-check.outputs.resume != 'true'
        name: Download the five cross-platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: build-binaries
          digest-mismatch: error
      - if: needs.version-check.outputs.resume != 'true'
        name: Download the native binary verified by main CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.version-check.outputs.ci_native_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.version-check.outputs.ci_run_id }}
          path: build-binaries/binary-x86_64-unknown-linux-gnu
          digest-mismatch: error
      - if: needs.version-check.outputs.resume != 'true'
        name: Restore the native binary executable mode
        run: chmod 755 build-binaries/binary-x86_64-unknown-linux-gnu/hardgate
      - if: needs.version-check.outputs.resume == 'true'
        name: Download the previously verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.version-check.outputs.resume_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          path: dist
          digest-mismatch: error
      - if: needs.version-check.outputs.resume != 'true'
        name: Create deterministic archives and SBOM
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-package.mjs --incoming build-binaries --output dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
          node scripts/release-sbom.mjs --output "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          node scripts/release-checksums.mjs --dist dist --version "$RELEASE_VERSION"
      - name: Verify every archive and checksum before publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Install the actual seven packed npm artifacts before publication
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          packed_root=$(mktemp -d)
          trap 'rm -rf -- "$packed_root"' EXIT
          mkdir -p "$packed_root/packages" "$packed_root/source"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            cp -R "npm/$pkg" "$packed_root/source/$pkg"
            tar xOf "dist/$pkg.tar.gz" "$pkg/hardgate" > "$packed_root/source/$pkg/bin/hardgate"
            chmod 755 "$packed_root/source/$pkg/bin/hardgate"
            cp LICENSE-MIT LICENSE-APACHE "$packed_root/source/$pkg/"
            (cd "$packed_root/source/$pkg" && npm pack --ignore-scripts --pack-destination "$packed_root/packages")
          done
          cp -R npm/hardgate "$packed_root/source/hardgate"
          cp LICENSE-MIT LICENSE-APACHE "$packed_root/source/hardgate/"
          (cd "$packed_root/source/hardgate" && npm pack --ignore-scripts --pack-destination "$packed_root/packages")
          binary="$packed_root/source/hardgate-linux-x64/bin/hardgate"
          test "$("$binary" --version)" = "hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          node release-tooling/scripts/check-packed-consumers.mjs --json \
            --packages-dir "$packed_root/packages" --binary "$binary" --version "$RELEASE_VERSION"
      # Use "Re-run failed jobs" for ordinary recovery so this immutable
      # checkpoint remains available. If the workflow definition itself needs
      # repair, dispatch the fixed workflow with the failed run's
      # resume_run_id; version-check binds that bundle back to this signed SHA.
      - id: upload_bundle
        name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest verified release artifacts
    needs: [version-check, package]
    # `package` intentionally depends on a skipped build matrix during a
    # verified resume. `always()` prevents that skip from propagating after
    # package itself succeeded.
    if: >-
      ${{
        always() &&
        needs.version-check.result == 'success' &&
        needs.package.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Recheck the signed tag and immutable bundle before attestation
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Sign archive checksums with GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Sign archive SBOM with GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/hardgate-${{ needs.version-check.outputs.version }}.sbom.cdx.json

  publication-preflight:
    name: Validate publication prerequisites
    needs: [version-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A recovery dispatch runs this workflow from the exact successful
          # main commit, where publication safety helpers are reviewed by CI.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Prevent latest-channel rollback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          latest_metadata=$(mktemp)
          latest_error=$(mktemp)
          cleanup_latest_metadata() {
            rm -f "$latest_metadata" "$latest_error"
          }
          trap cleanup_latest_metadata EXIT
          if gh api -X GET "repos/${GITHUB_REPOSITORY}/releases/latest" > "$latest_metadata" 2> "$latest_error"; then
            latest_tag=$(jq -er '.tag_name | select(type == "string" and length > 0)' "$latest_metadata") || {
              echo "GitHub latest release has no valid tag name; refusing registry publication" >&2
              exit 1
            }
            node scripts/release-order.mjs --target-tag "$RELEASE_TAG" --latest-tag "$latest_tag"
          else
            status=$?
            if [ "$status" -eq 1 ] && grep -Eiq 'HTTP[[:space:]]+404|404[[:space:]]+Not Found' "$latest_error"; then
              echo "no existing published GitHub release; $RELEASE_TAG establishes the latest channel"
            else
              cat "$latest_error" >&2
              echo "unable to determine the current GitHub latest release; refusing registry publication" >&2
              exit 1
            fi
          fi
          for package_name in \
            hardgate-linux-x64 \
            hardgate-linux-x64-musl \
            hardgate-linux-arm64 \
            hardgate-linux-arm64-musl \
            hardgate-darwin-x64 \
            hardgate-darwin-arm64 \
            @tech-byte-frontier/hardgate
          do
            encoded_name=$(printf '%s' "$package_name" | sed 's|/|%2f|g')
            npm_status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$latest_metadata" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}/latest") || {
              echo "unable to query npm latest for $package_name; refusing registry publication" >&2
              exit 1
            }
            case "$npm_status" in
              200)
                latest_version=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' < "$latest_metadata") || {
                  echo "npm latest for $package_name has no valid version; refusing registry publication" >&2
                  exit 1
                }
                node scripts/release-order.mjs --target-tag "v$RELEASE_VERSION" --latest-tag "v$latest_version"
                ;;
              404) echo "$package_name has no npm latest tag; $RELEASE_VERSION establishes it" ;;
              *) echo "npm latest probe for $package_name returned HTTP $npm_status; refusing registry publication" >&2; exit 1 ;;
            esac
          done
      - run: npm install --global "npm@${NPM_VERSION}"
      # Cargo has no non-mutating remote credential check. Main CI's dry run
      # validates the package; the single publish job performs authentication.
      - name: Require the crates.io publication credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is required for crates.io publication" >&2
            exit 1
          fi
      - name: Validate the selected npm publisher authentication mode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/npm-publisher-preflight.mjs
      - name: Validate npm channel promotion authentication
        if: env.HARDGATE_NPM_AUTH_MODE == 'trusted'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/npm-publisher-preflight.mjs --auth-mode token

  receipt-init:
    name: Record the verified release identity
    needs: [version-check, package]
    if: >-
      ${{ always() && needs.version-check.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Bind the receipt to signed source and verified bundle
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
          BUNDLE_ARTIFACT_ID: ${{ needs.package.outputs.bundle_artifact_id }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          mkdir -p receipt
          node release-tooling/scripts/release-receipt-cli.mjs create --output receipt/release.json \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --tooling-sha "$GITHUB_SHA" \
            --tag-object "$(git rev-parse "$RELEASE_TAG")" --build-run-id "$GITHUB_RUN_ID" \
            --artifact-id "$BUNDLE_ARTIFACT_ID" --dist dist
      - id: upload_receipt
        name: Retain the initial release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-seed-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish verified GitHub Release
    needs: [version-check, package, attest, publication-preflight, receipt-init]
    if: >-
      ${{
        always() &&
        needs.version-check.result == 'success' &&
        needs.package.result == 'success' &&
        needs.attest.result == 'success' &&
        needs.publication-preflight.result == 'success' &&
        needs.receipt-init.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Recheck signed tag immediately before GitHub publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Recheck checksums immediately before publication
        run: cd dist && sha256sum --check --strict SHA256SUMS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.receipt-init.outputs.receipt_artifact_id }}
          path: receipt
          digest-mismatch: error
      - name: Verify receipt identity before publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test -f receipt/release.json
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tooling/scripts/release-receipt-cli.mjs create --output receipt/release.json \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --tooling-sha "$GITHUB_SHA" \
            --tag-object "$(git rev-parse "$RELEASE_TAG")" --build-run-id "$GITHUB_RUN_ID" \
            --artifact-id '${{ needs.package.outputs.bundle_artifact_id }}' --dist dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel github-assets --to staged
          node release-tooling/scripts/stage-github-release.mjs --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --dist dist
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel github-assets --to immutable_verified
      - name: Record GitHub staging failure
        if: failure() && hashFiles('receipt/release.json') != ''
        run: node release-tooling/scripts/release-receipt-cli.mjs failure --receipt receipt/release.json --channel github-assets --code github-staging-failed --message 'GitHub staging or immutable verification failed; inspect the job before recovery.'
      - id: upload_receipt
        name: Retain the GitHub staging receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-github-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90

  publish-crates:
    name: Publish verified crate
    needs: [version-check, package, github-release]
    if: >-
      ${{
        always() &&
        needs.version-check.result == 'success' &&
        needs.package.result == 'success' &&
        needs.github-release.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.github-release.outputs.receipt_artifact_id }}
          path: receipt
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Verify receipt identity before publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test -f receipt/release.json
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tooling/scripts/release-receipt-cli.mjs create --output receipt/release.json \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --tooling-sha "$GITHUB_SHA" \
            --tag-object "$(git rev-parse "$RELEASE_TAG")" --build-run-id "$GITHUB_RUN_ID" \
            --artifact-id '${{ needs.package.outputs.bundle_artifact_id }}' --dist dist
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Recheck signed tag immediately before crates.io publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
      - name: Prepare the immutable crate and staging checkpoint
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          cargo package --locked --no-verify
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel hardgate --to staged
      - id: crate-state
        name: Check crate publication state
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          api="https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}"
          crate_probe() {
            body=$(mktemp)
            status=$(curl --location --silent --show-error --user-agent "$HARDGATE_CRATES_IO_USER_AGENT" --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "$api") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          crate_version() {
            retry_absent="$1"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(crate_probe); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          already_published=0
          if current=$(crate_version 0); then
            test "$current" = "$RELEASE_VERSION"
            already_published=1
            echo "hardgate@$current is present; immutable verification follows"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "crates.io version probe failed; refusing to publish" >&2
              exit "$status"
            fi
          fi
          if [ "$already_published" -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crate-state.outputs.publish == 'true'
        name: Publish crate when exact version is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_token="${CARGO_REGISTRY_TOKEN:?CARGO_REGISTRY_TOKEN is required}"
          unset CARGO_REGISTRY_TOKEN
          # Pace the preceding anonymous version probe and this upload to the
          # crates.io limit of at most one API request per second.
          sleep 1
          CARGO_REGISTRY_TOKEN="$publish_token" cargo publish --locked
          unset publish_token
      - name: Verify published crate identity without publish credentials
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          # crates.io permits at most one API request per second. Keep an
          # explicit gap before the identity probe on every publication path.
          sleep 1
          node release-tooling/scripts/verify-crate-publication.mjs \
            --expected "target/package/hardgate-${RELEASE_VERSION}.crate" \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT"
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel hardgate --to immutable_verified
          crate_root=$(mktemp -d)
          trap 'rm -rf -- "$crate_root"' EXIT
          crate_installed=0
          for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
            if cargo install hardgate --version "=$RELEASE_VERSION" --locked --force --root "$crate_root"; then
              crate_installed=1
              break
            fi
            [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
          done
          test "$crate_installed" -eq 1
          test -x "$crate_root/bin/hardgate"
          test "$("$crate_root/bin/hardgate" --version)" = "hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel hardgate --to exact_consumer_verified --consumer "$crate_root/bin/hardgate"
      - name: Record crate failure
        if: failure() && hashFiles('receipt/release.json') != ''
        run: node release-tooling/scripts/release-receipt-cli.mjs failure --receipt receipt/release.json --channel hardgate --code crate-failed --message 'Publication or verification failed; inspect the job before recovery.'
      - id: upload_receipt
        name: Retain the crate receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-crate-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    name: Publish platform packages, then wrapper
    needs: [version-check, package, github-release, publish-crates]
    if: >-
      ${{
        always() &&
        needs.version-check.result == 'success' &&
        needs.package.result == 'success' &&
        needs.github-release.result == 'success' &&
        needs.publish-crates.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publication payload stays on the signed tag above. Recovery-only
          # verifier fixes come from the exact main commit approved by CI.
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - name: Recheck signed tag immediately before npm publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish-crates.outputs.receipt_artifact_id }}
          path: receipt
          digest-mismatch: error
      - name: Verify receipt identity before publication
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test -f receipt/release.json
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          node release-tooling/scripts/release-receipt-cli.mjs create --output receipt/release.json \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --tooling-sha "$GITHUB_SHA" \
            --tag-object "$(git rev-parse "$RELEASE_TAG")" --build-run-id "$GITHUB_RUN_ID" \
            --artifact-id '${{ needs.package.outputs.bundle_artifact_id }}' --dist dist
      - name: Verify release bundle and prepare npm packages
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          cmp -- npm/hardgate/bin/hardgate.js release-tooling/npm/hardgate/bin/hardgate.js
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/sync-npm-version.mjs --check --tag "$RELEASE_TAG"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            mkdir -p "npm/$pkg/bin"
            tar xOf "dist/$pkg.tar.gz" "$pkg/hardgate" > "npm/$pkg/bin/hardgate"
            chmod 755 "npm/$pkg/bin/hardgate"
            cp LICENSE-MIT LICENSE-APACHE "npm/$pkg/"
            (cd "npm/$pkg" && npm pack --dry-run --json >/dev/null)
          done
          cp LICENSE-MIT LICENSE-APACHE npm/hardgate/
          (cd npm/hardgate && npm pack --dry-run --json >/dev/null)
      - name: Publish and verify each platform package in order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            printf '%s' "$pkg" > receipt/active-channel
            node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel "$pkg" --to staged
            node release-tooling/scripts/publish-npm-package.mjs --package-dir "./npm/$pkg" --version "$RELEASE_VERSION" --dist dist
            node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel "$pkg" --to immutable_verified
          done
          unset NODE_AUTH_TOKEN
          printf '%s' '@tech-byte-frontier/hardgate' > receipt/active-channel
          node release-tooling/scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist --platform-only
      - name: Publish wrapper only after all platforms are verified
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' '@tech-byte-frontier/hardgate' > receipt/active-channel
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel '@tech-byte-frontier/hardgate' --to staged
          node release-tooling/scripts/publish-npm-package.mjs --package-dir ./npm/hardgate --version "$RELEASE_VERSION" --dist dist
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel '@tech-byte-frontier/hardgate' --to immutable_verified
          unset NODE_AUTH_TOKEN
          node release-tooling/scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist
      - name: Record npm staging failure
        if: failure() && hashFiles('receipt/release.json') != ''
        run: |
          set -euo pipefail
          channel='@tech-byte-frontier/hardgate'
          if [ -f receipt/active-channel ]; then channel=$(cat receipt/active-channel); fi
          node release-tooling/scripts/release-receipt-cli.mjs failure --receipt receipt/release.json \
            --channel "$channel" --code npm-staging-failed \
            --message 'npm preparation or verification failed; this channel is blocked. Inspect the job for the failing package before recovery.'
      - id: upload_receipt
        name: Retain the npm staging receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-npm-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90

  verify-native-exact:
    name: Verify exact native ${{ matrix.package }}
    needs: [version-check, package, publish-npm]
    if: >-
      ${{
        always() &&
        needs.version-check.result == 'success' &&
        needs.package.result == 'success' &&
        needs.publish-npm.result == 'success'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: hardgate-linux-x64
            runner: ubuntu-24.04
          - package: hardgate-linux-x64-musl
            runner: ubuntu-24.04
          - package: hardgate-linux-arm64
            runner: ubuntu-24.04-arm
          - package: hardgate-linux-arm64-musl
            runner: ubuntu-24.04-arm
          - package: hardgate-darwin-x64
            runner: macos-15-intel
          - package: hardgate-darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      NATIVE_MODE: exact
      MATRIX_PACKAGE: ${{ matrix.package }}
      RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
      EXPECTED_TOOLING_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - name: Download the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Download the publish receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish-npm.outputs.receipt_artifact_id }}
          path: receipt
          digest-mismatch: error
      - name: Verify signed source, tooling, and receipt identity
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
          node release-tooling/scripts/release-receipt-cli.mjs assert --receipt receipt/release.json
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg source "$RELEASE_COMMIT" \
            --arg tooling "$EXPECTED_TOOLING_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg artifact '${{ needs.package.outputs.bundle_artifact_id }}' \
            --arg tag_object "$(git rev-parse "$RELEASE_TAG")" \
            '.identity.version == $version and .identity.source_sha == $source and .identity.tooling_sha == $tooling and .identity.build_run_id == $run and .identity.artifact_id == $artifact and .identity.signed_tag_object == $tag_object' \
            receipt/release.json >/dev/null
      - name: Verify the native exact consumer and write proof
        run: |
          set -euo pipefail
          verify_args=(
            node release-tooling/scripts/verify-native-channel.mjs
            --package "$MATRIX_PACKAGE"
            --version "$RELEASE_VERSION"
            --source-sha "$RELEASE_COMMIT"
            --archive "dist/${MATRIX_PACKAGE}.tar.gz"
            --mode "$NATIVE_MODE"
            --output native-proof.json
          )
