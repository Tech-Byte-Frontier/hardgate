          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          cmp -- npm/hardgate/bin/hardgate.js release-tooling/npm/hardgate/bin/hardgate.js
          release_metadata=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
          release_tag=$(printf '%s\n' "$release_metadata" | jq -r '.tagName')
          release_is_draft=$(printf '%s\n' "$release_metadata" | jq -r '.isDraft')
          release_is_prerelease=$(printf '%s\n' "$release_metadata" | jq -r '.isPrerelease')
          latest_release_tag=$(gh release view --json tagName --jq .tagName)
          test "$release_tag" = "$RELEASE_TAG"
          test "$release_is_draft" = false
          test "$release_is_prerelease" = false
          test "$latest_release_tag" = "$RELEASE_TAG"
          assets=(
            hardgate-linux-x64.tar.gz
            hardgate-linux-x64-musl.tar.gz
            hardgate-linux-arm64.tar.gz
            hardgate-linux-arm64-musl.tar.gz
            hardgate-darwin-x64.tar.gz
            hardgate-darwin-arm64.tar.gz
            SHA256SUMS
            "hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          )
          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)
          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets"
          mkdir -p dist
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir dist
          done
          for asset in "${assets[@]}"; do test -s "dist/$asset"; done
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          node release-tooling/scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist
      - name: Download the promoted receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-channels.outputs.receipt_artifact_id }}
          path: receipt
          digest-mismatch: error
      - name: Verify signed source, tooling, and promoted receipt identity
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
          EXPECTED_TOOLING_SHA: ${{ github.sha }}
          EXPECTED_BUNDLE_ARTIFACT_ID: ${{ needs.package.outputs.bundle_artifact_id }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
          cmp -- npm/hardgate/bin/hardgate.js release-tooling/npm/hardgate/bin/hardgate.js
          tag_object="$(git rev-parse "$RELEASE_TAG")"
          node release-tooling/scripts/release-receipt-cli.mjs assert --receipt receipt/release.json
          jq -e --arg version "$RELEASE_VERSION" --arg source "$RELEASE_COMMIT" \
            --arg tooling "$EXPECTED_TOOLING_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg artifact "$EXPECTED_BUNDLE_ARTIFACT_ID" --arg tag_object "$tag_object" \
            '.identity.version == $version and .identity.source_sha == $source and .identity.tooling_sha == $tooling and .identity.build_run_id == $run and .identity.artifact_id == $artifact and .identity.signed_tag_object == $tag_object' \
            receipt/release.json >/dev/null

      - id: crate_default
        name: Install the default crate and checkpoint only hardgate
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          unset HARDGATE_BINARY HARDGATE_BINARY_PATH HARDGATE_NATIVE_BINARY HARDGATE_LAUNCHER_DEPTH NODE_OPTIONS
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          cargo_bin=$(command -v cargo)
          node_bin=$(dirname "$(command -v node)")
          export PATH="$(dirname "$cargo_bin"):$node_bin:/usr/bin:/bin"
          install_tmp=$(mktemp -d)
          trap 'rm -rf "$install_tmp"' EXIT
          trap 'exit 130' HUP INT TERM
          export HOME="$install_tmp/home"
          export CARGO_HOME="$install_tmp/cargo-home"
          export RUSTUP_HOME="$rustup_home"
          mkdir -p "$HOME" "$CARGO_HOME"
          cargo package --locked --no-verify
          node release-tooling/scripts/verify-crate-publication.mjs \
            --expected "target/package/hardgate-$RELEASE_VERSION.crate" \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --require-default
          crate_root="$install_tmp/crate-root"
          cargo install hardgate --locked --force --root "$crate_root"
          test -x "$crate_root/bin/hardgate"
          expected="hardgate $RELEASE_VERSION ($RELEASE_COMMIT)"
          test "$("$crate_root/bin/hardgate" --version)" = "$expected"
          node release-tooling/scripts/release-receipt-cli.mjs advance \
            --receipt receipt/release.json --channel hardgate \
            --to default_consumer_verified --consumer "$crate_root/bin/hardgate"
      - name: Record crate default failure
        if: failure() && steps.crate_default.outcome == 'failure' && hashFiles('receipt/release.json') != ''
        run: |
          node release-tooling/scripts/release-receipt-cli.mjs failure \
            --receipt receipt/release.json --channel hardgate \
            --code crate-default-failed \
            --message 'Crate default installation or verification failed; inspect this job before recovery.'

      - name: Verify default npm, pnpm, Yarn, Bun, and shell consumers
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          unset HARDGATE_BINARY HARDGATE_BINARY_PATH HARDGATE_NATIVE_BINARY HARDGATE_LAUNCHER_DEPTH NODE_OPTIONS HARDGATE_VERSION
          consumer_tmp=$(mktemp -d)
          trap 'rm -rf "$consumer_tmp"' EXIT
          trap 'exit 130' HUP INT TERM
          private_bin="$consumer_tmp/private-bin"
          mkdir -p "$private_bin"
          printf '%s\n' '#!/bin/sh' 'exit 127' > "$private_bin/hardgate"
          chmod 755 "$private_bin/hardgate"
          node_tool=$(command -v node)
          npm_tool=$(command -v npm)
          pnpm_tool=$(command -v pnpm)
          yarn_tool=$(command -v yarn)
          bun_tool=$(command -v bun)
          node_bin=$(dirname "$node_tool")
          manager_path="$private_bin:$node_bin:$(dirname "$npm_tool"):$(dirname "$pnpm_tool"):$(dirname "$yarn_tool"):$(dirname "$bun_tool"):/usr/bin:/bin"
          runtime_path="$private_bin:$node_bin:/usr/bin:/bin"
          expected="hardgate $RELEASE_VERSION ($RELEASE_COMMIT)"
          expected_native="$consumer_tmp/hardgate-linux-x64"
          tar xOf "dist/hardgate-linux-x64.tar.gz" hardgate-linux-x64/hardgate > "$expected_native"
          chmod 755 "$expected_native"
          wrapper_source="$PWD/npm/hardgate/bin/hardgate.js"
          verify_script="$consumer_tmp/verify-installed.mjs"
          cat > "$verify_script" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          const [rootInput, commandInput, nativeInput, wrapperInput, version, label] = process.argv.slice(2);
          const wrapperName = "@tech-byte-frontier/hardgate";
          const nativeName = "hardgate-linux-x64";
          const fail = (message) => { throw new Error(label + ": " + message); };
          const inside = (base, candidate) => {
            const relative = path.relative(base, candidate);
            return relative !== "" && relative !== ".." && !relative.startsWith(".." + path.sep) && !path.isAbsolute(relative);
          };
          const readJson = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
          const resolveFrom = (base, specifier) => fs.realpathSync(createRequire(path.join(base, ".hardgate-resolve.cjs")).resolve(specifier));
          const root = fs.realpathSync(rootInput);
          const commandEntry = path.resolve(commandInput);
          if (!inside(root, commandEntry)) fail("launcher command escaped fresh root");
          const command = fs.realpathSync(commandEntry);
          const launcherCandidates = [command];
          let shim = "";
          try { shim = fs.readFileSync(commandEntry, "utf8"); } catch {}
          const shimTarget = shim.match(/^# cmd-shim-target=(.+)$/m)?.[1]?.trim();
          if (shimTarget) {
            const target = path.resolve(path.dirname(commandEntry), shimTarget);
            launcherCandidates.push(fs.realpathSync(target));
          }
          const launcher = [...new Set(launcherCandidates)].find((candidate) =>
            candidate.endsWith(`${path.sep}bin${path.sep}hardgate.js`));
          if (!launcher) fail("installed command does not resolve to bin/hardgate.js");
          const wrapperRoot = path.dirname(path.dirname(launcher));
          if (!inside(root, wrapperRoot)) fail("wrapper escaped fresh root");
          const wrapperManifestPath = fs.realpathSync(path.join(wrapperRoot, "package.json"));
          if (!inside(root, wrapperManifestPath)) fail("wrapper manifest escaped fresh root");
          const wrapperManifest = readJson(wrapperManifestPath);
          if (wrapperManifest.name !== wrapperName || wrapperManifest.version !== version) fail("wrapper identity mismatch");
          if (wrapperManifest.bin?.hardgate !== "bin/hardgate.js") fail("wrapper bin entry mismatch");
          if (!fs.readFileSync(launcher).equals(fs.readFileSync(wrapperInput))) fail("wrapper launcher bytes differ");
          let nativeManifestPath;
          try { nativeManifestPath = resolveFrom(wrapperRoot, nativeName + "/package.json"); } catch {}
          if (!nativeManifestPath) fail("native package is not resolvable from checked wrapper");
          nativeManifestPath = fs.realpathSync(nativeManifestPath);
          if (!inside(root, nativeManifestPath)) fail("native manifest escaped fresh root");
          const nativeRoot = path.dirname(nativeManifestPath);
          if (!inside(root, nativeRoot)) fail("native package escaped fresh root");
          const nativeManifest = readJson(nativeManifestPath);
          if (nativeManifest.name !== nativeName || nativeManifest.version !== version) fail("native identity mismatch");
          const nativeBinary = fs.realpathSync(path.join(nativeRoot, "bin", "hardgate"));
          if (!inside(root, nativeBinary)) fail("native binary escaped fresh root");
          if (!fs.readFileSync(nativeBinary).equals(fs.readFileSync(nativeInput))) fail("native bytes differ from dist GNU x64 bytes");
          const wrapperModule = createRequire(launcher)(launcher);
          if (typeof wrapperModule.findBinary !== "function") fail("wrapper does not export findBinary");
          const resolvedNative = wrapperModule.findBinary();
          if (!resolvedNative || fs.realpathSync(resolvedNative) !== nativeBinary) fail("wrapper findBinary did not resolve the checked native binary");
          process.stdout.write(label + ": verified\n");
          NODE
          make_project() {
            project="$1"
            mkdir -p "$project"
            printf '%s\n' '{"name":"hardgate-default-consumer","private":true,"version":"1.0.0"}' > "$project/package.json"
          }
          verify_install() {
            root="$1"; command="$2"; home="$3"; label="$4"
            version_output=$(env -i HOME="$home" PATH="$runtime_path" "$command" --version)
            test "$version_output" = "$expected"
            env -i HOME="$home" PATH="$runtime_path" "$node_tool" "$verify_script" \
              "$root" "$command" "$expected_native" "$wrapper_source" "$RELEASE_VERSION" "$label"
          }

          npm_project="$consumer_tmp/npm-project"; npm_home="$consumer_tmp/npm-home"
          npm_cache="$consumer_tmp/npm-cache"; npm_config="$consumer_tmp/npmrc"
          make_project "$npm_project"; mkdir -p "$npm_home" "$npm_cache"
          printf '%s\n' 'audit=false' 'fund=false' 'ignore-scripts=true' 'include=optional' > "$npm_config"
          env -i HOME="$npm_home" PATH="$manager_path" NPM_CONFIG_USERCONFIG="$npm_config" \
            NPM_CONFIG_CACHE="$npm_cache" NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false NPM_CONFIG_FETCH_RETRIES=0 \
            NPM_CONFIG_FETCH_TIMEOUT=20000 NPM_CONFIG_IGNORE_SCRIPTS=true "$npm_tool" install --ignore-scripts --prefix "$npm_project" \
            --include=optional "@tech-byte-frontier/hardgate@latest"
          verify_install "$npm_project" "$npm_project/node_modules/.bin/hardgate" "$npm_home" npm-project

          pnpm_project="$consumer_tmp/pnpm-project"; pnpm_home="$consumer_tmp/pnpm-home"
          pnpm_config="$consumer_tmp/pnpm-config"; pnpm_store="$consumer_tmp/pnpm-store"
          make_project "$pnpm_project"; mkdir -p "$pnpm_home" "$pnpm_config" "$pnpm_store"
          (cd "$pnpm_project" && env -i HOME="$pnpm_home" XDG_CONFIG_HOME="$pnpm_config" \
            PNPM_STORE_DIR="$pnpm_store" PATH="$manager_path" "$pnpm_tool" add \
            --ignore-scripts --registry=https://registry.npmjs.org/ --store-dir "$pnpm_store" "@tech-byte-frontier/hardgate@latest")
          verify_install "$pnpm_project" "$pnpm_project/node_modules/.bin/hardgate" "$pnpm_home" pnpm-project

          yarn_project="$consumer_tmp/yarn-project"; yarn_home="$consumer_tmp/yarn-home"
          yarn_cache="$consumer_tmp/yarn-cache"; make_project "$yarn_project"; mkdir -p "$yarn_home" "$yarn_cache"
          printf '%s\n' 'nodeLinker: node-modules' > "$yarn_project/.yarnrc.yml"
          (cd "$yarn_project" && env -i HOME="$yarn_home" YARN_CACHE_FOLDER="$yarn_cache" YARN_ENABLE_SCRIPTS=false \
            YARN_GLOBAL_FOLDER="$yarn_home/.yarn" PATH="$manager_path" "$yarn_tool" add "@tech-byte-frontier/hardgate@latest")
          verify_install "$yarn_project" "$yarn_project/node_modules/.bin/hardgate" "$yarn_home" yarn-project

          bun_project="$consumer_tmp/bun-project"; bun_home="$consumer_tmp/bun-home"
          bun_cache="$consumer_tmp/bun-cache"; make_project "$bun_project"; mkdir -p "$bun_home" "$bun_cache"
          (cd "$bun_project" && env -i HOME="$bun_home" BUN_INSTALL_CACHE_DIR="$bun_cache" \
            PATH="$manager_path" "$bun_tool" add --ignore-scripts --registry=https://registry.npmjs.org/ "@tech-byte-frontier/hardgate@latest")
          verify_install "$bun_project" "$bun_project/node_modules/.bin/hardgate" "$bun_home" bun-project

          npm_global="$consumer_tmp/npm-global"; npm_global_home="$consumer_tmp/npm-global-home"
          npm_global_cache="$consumer_tmp/npm-global-cache"; npm_global_config="$consumer_tmp/npm-global-npmrc"
          mkdir -p "$npm_global" "$npm_global_home" "$npm_global_cache"
          printf '%s\n' 'audit=false' 'fund=false' 'ignore-scripts=true' > "$npm_global_config"
          env -i HOME="$npm_global_home" PATH="$manager_path" NPM_CONFIG_USERCONFIG="$npm_global_config" \
            NPM_CONFIG_CACHE="$npm_global_cache" NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false NPM_CONFIG_IGNORE_SCRIPTS=true "$npm_tool" install --ignore-scripts --global --prefix "$npm_global" \
            "@tech-byte-frontier/hardgate@latest"
          npm_global_command="$npm_global/bin/hardgate"; test -x "$npm_global_command"
          env -i HOME="$npm_global_home" EXPECTED="$expected" PATH="$npm_global/bin:$private_bin:$node_bin:/usr/bin:/bin" \
            sh -c 'test "$(command -v hardgate)" = "$1" && test "$(hardgate --version)" = "$EXPECTED"' sh "$npm_global_command"
          verify_install "$npm_global" "$npm_global_command" "$npm_global_home" npm-global

          pnpm_global="$consumer_tmp/pnpm-global"; pnpm_global_home="$consumer_tmp/pnpm-global-home"
          pnpm_global_config="$consumer_tmp/pnpm-global-config"; pnpm_global_store="$pnpm_global/store"
          mkdir -p "$pnpm_global" "$pnpm_global_home" "$pnpm_global_config" "$pnpm_global_store"
          env -i HOME="$pnpm_global_home" XDG_CONFIG_HOME="$pnpm_global_config" \
            PNPM_HOME="$pnpm_global" PNPM_STORE_DIR="$pnpm_global_store" PATH="$pnpm_global:$manager_path" \
            "$pnpm_tool" add --ignore-scripts --global --store-dir "$pnpm_global_store" "@tech-byte-frontier/hardgate@latest"
          pnpm_global_bin=$(env -i HOME="$pnpm_global_home" XDG_CONFIG_HOME="$pnpm_global_config" \
            PNPM_HOME="$pnpm_global" PNPM_STORE_DIR="$pnpm_global_store" PATH="$pnpm_global:$manager_path" \
            "$pnpm_tool" bin --global)
          test -d "$pnpm_global_bin"; pnpm_global_command="$pnpm_global_bin/hardgate"
          test -x "$pnpm_global_command"
          env -i HOME="$pnpm_global_home" EXPECTED="$expected" PATH="$pnpm_global_bin:$private_bin:$node_bin:/usr/bin:/bin" \
            sh -c 'test "$(command -v hardgate)" = "$1" && test "$(hardgate --version)" = "$EXPECTED"' sh "$pnpm_global_command"
          verify_install "$pnpm_global" "$pnpm_global_command" "$pnpm_global_home" pnpm-global

          shell_root="$consumer_tmp/shell-install"; shell_home="$consumer_tmp/shell-home"
          mkdir -p "$shell_root" "$shell_home"
          env -i HOME="$shell_home" PATH=/usr/bin:/bin HARDGATE_INSTALL_DIR="$shell_root" sh scripts/install.sh
          installed_sha=$(sha256sum "$shell_root/hardgate" | awk '{print $1}')
          expected_sha=$(sha256sum "$expected_native" | awk '{print $1}')
          test "$installed_sha" = "$expected_sha"
          test "$("$shell_root/hardgate" --version)" = "$expected"

      - id: upload_receipt
        name: Retain default consumer receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-consumers-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90

  release-complete:
    name: Release publication aggregate
    if: ${{ always() }}
    needs: [version-check, package, attest, publication-preflight, receipt-init, github-release, publish-crates, publish-npm, verify-native-exact, promote-channels, verify-native-default, verify-channels]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
      RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
    steps:
      - name: Require every publication and verification job to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-channels.outputs.receipt_artifact_id }}
          path: expected-receipt
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-channels.outputs.receipt_artifact_id }}
          path: consumer-receipt
          digest-mismatch: error
      - id: select_receipts
        name: Select the latest default receipt for every native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          ids=$(node release-tooling/scripts/select-receipt-artifacts.mjs --phase default --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY")
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select_receipts.outputs.ids }}
          path: default-receipts
          digest-mismatch: error
      - name: Require matching identity and every default consumer checkpoint
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          node release-tooling/scripts/release-receipt-cli.mjs assert --receipt expected-receipt/release.json
          jq -e --arg version "$RELEASE_VERSION" --arg source "$RELEASE_COMMIT" --arg tooling "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg artifact '${{ needs.package.outputs.bundle_artifact_id }}' \
            --arg tag_object "$(git rev-parse "$RELEASE_TAG")" \
            '.identity.version == $version and .identity.source_sha == $source and .identity.tooling_sha == $tooling and .identity.build_run_id == $run and .identity.artifact_id == $artifact and .identity.signed_tag_object == $tag_object' \
            expected-receipt/release.json >/dev/null
          mkdir -p receipt
          node release-tooling/scripts/merge-release-receipts.mjs --expected expected-receipt/release.json \
            --output receipt/release.json --require-complete \
            expected-receipt/release.json consumer-receipt/release.json default-receipts/*/release.json
      - name: Retain the aggregate release receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-complete-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90
