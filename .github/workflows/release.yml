          sudo systemctl start "user@$(id -u).service"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-channels.outputs.receipt_artifact_id }}
          path: receipt
          digest-mismatch: error
      - name: Verify signed source, tooling, and receipt identity
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
          node release-tooling/scripts/release-receipt-cli.mjs assert --receipt receipt/release.json
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg source "$RELEASE_COMMIT" \
            --arg tooling "$EXPECTED_TOOLING_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg artifact '${{ needs.package.outputs.bundle_artifact_id }}' \
            --arg tag_object "$(git rev-parse "$RELEASE_TAG")" \
            '.identity.version == $version and .identity.source_sha == $source and .identity.tooling_sha == $tooling and .identity.build_run_id == $run and .identity.artifact_id == $artifact and .identity.signed_tag_object == $tag_object' \
            receipt/release.json >/dev/null
      - name: Download and verify the complete release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          cmp -- npm/hardgate/bin/hardgate.js release-tooling/npm/hardgate/bin/hardgate.js
          release_metadata=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
          release_tag=$(printf '%s\n' "$release_metadata" | jq -r '.tagName')
          release_is_draft=$(printf '%s\n' "$release_metadata" | jq -r '.isDraft')
          release_is_prerelease=$(printf '%s\n' "$release_metadata" | jq -r '.isPrerelease')
          latest_release_tag=$(gh release view --json tagName --jq .tagName)
          test "$release_tag" = "$RELEASE_TAG"
          test "$release_is_draft" = false
          test "$release_is_prerelease" = false
          test "$latest_release_tag" = "$RELEASE_TAG"
          assets=(
            hardgate-linux-x64.tar.gz
            SHA256SUMS
            "hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          )
          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)
          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets"
          mkdir -p published-dist
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir published-dist
          done
          for asset in "${assets[@]}"; do cmp -- "dist/$asset" "published-dist/$asset"; done
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          node release-tooling/scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist
      - name: Verify the native default consumer and write proof
        run: |
          set -euo pipefail
          verify_args=(
            node release-tooling/scripts/verify-native-channel.mjs
            --package "hardgate-linux-x64"
            --version "$RELEASE_VERSION"
            --source-sha "$RELEASE_COMMIT"
            --archive "dist/hardgate-linux-x64.tar.gz"
            --mode "$NATIVE_MODE"
            --output native-proof.json
          )
          verify_args+=(--wrapper-source npm/hardgate/bin/hardgate.js)
          "${verify_args[@]}"
      - name: Verify installed npm and pnpm checks (default)
        run: bash release-tooling/scripts/release-consumers.sh default
      - name: Apply native proof to the release receipt
        run: node release-tooling/scripts/apply-native-receipt.mjs --receipt receipt/release.json --proof native-proof.json
      - id: direct_consumer
        name: Verify direct release download (default)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-tooling/scripts/release-direct-consumer.sh default
      - id: crate_default
        name: Install the default crate and checkpoint only hardgate
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          unset HARDGATE_BINARY HARDGATE_BINARY_PATH HARDGATE_NATIVE_BINARY HARDGATE_LAUNCHER_DEPTH NODE_OPTIONS
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          cargo_bin=$(command -v cargo)
          node_bin=$(dirname "$(command -v node)")
          export PATH="$(dirname "$cargo_bin"):$node_bin:/usr/bin:/bin"
          install_tmp=$(mktemp -d)
          trap 'rm -rf "$install_tmp"' EXIT
          trap 'exit 130' HUP INT TERM
          export HOME="$install_tmp/home"
          export CARGO_HOME="$install_tmp/cargo-home"
          export RUSTUP_HOME="$rustup_home"
          mkdir -p "$HOME" "$CARGO_HOME"
          scripts/with-resource-limits.sh cargo package --locked --no-verify
          node release-tooling/scripts/verify-crate-publication.mjs \
            --expected "target/package/hardgate-$RELEASE_VERSION.crate" \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --require-default
          crate_root="$install_tmp/crate-root"
          scripts/with-resource-limits.sh cargo install hardgate --locked --force --root "$crate_root"
          test -x "$crate_root/bin/hardgate"
          expected="hardgate $RELEASE_VERSION ($RELEASE_COMMIT)"
          test "$("$crate_root/bin/hardgate" --version)" = "$expected"
          node release-tooling/scripts/installed-check.mjs "$crate_root/bin/hardgate"
          node release-tooling/scripts/release-receipt-cli.mjs advance \
            --receipt receipt/release.json --channel hardgate \
            --to default_consumer_verified --consumer "$crate_root/bin/hardgate"
      - name: Record crate default failure
        if: failure() && steps.crate_default.outcome == 'failure' && hashFiles('receipt/release.json') != ''
        run: |
          node release-tooling/scripts/release-receipt-cli.mjs failure \
            --receipt receipt/release.json --channel hardgate \
            --code crate-default-failed \
            --message 'Crate default installation or verification failed; inspect this job before recovery.'

      - name: Record default consumer failure
        if: failure() && hashFiles('receipt/release.json') != ''
        run: |
          channel='@tech-byte-frontier/hardgate'
          if [ "${{ steps.direct_consumer.outcome }}" = failure ]; then channel=github-assets; fi
          node release-tooling/scripts/release-receipt-cli.mjs failure --receipt receipt/release.json \
            --channel "$channel" --code default-consumer-failed --message 'Installed consumer verification failed; inspect this checkpoint before recovery.'
      - name: Require every default consumer checkpoint
        run: node release-tooling/scripts/release-receipt-cli.mjs assert --receipt receipt/release.json --require-complete
      - id: upload_receipt
        name: Retain the final receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-final-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90
