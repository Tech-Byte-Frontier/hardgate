          test "$("$install_root/hardgate" --version)" = "hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          node release-tooling/scripts/release-receipt-cli.mjs advance \
            --receipt receipt/release.json \
            --channel github-assets \
            --to exact_consumer_verified \
            --consumer "$install_root/hardgate"
      - name: Record native exact failure
        if: failure() && hashFiles('receipt/release.json') != ''
        run: |
          failed_channel="$MATRIX_PACKAGE"
          if [ "${{ steps.installer.outcome }}" = failure ]; then failed_channel=github-assets; fi
          node release-tooling/scripts/release-receipt-cli.mjs failure \
            --receipt receipt/release.json \
            --channel "$failed_channel" \
            --code native-verification-failed \
            --message 'Native exact verification failed; inspect this matrix job before recovery.'
      - id: upload_receipt
        name: Retain exact native receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-exact-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact native proof
        if: always() && hashFiles('native-proof.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-proof-exact-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: native-proof.json
          if-no-files-found: error
          retention-days: 90

  promote-channels:
    name: Promote verified release channels
    needs: [version-check, package, publish-npm, verify-native-exact]
    if: >-
      ${{ always() && needs.version-check.result == 'success' &&
          needs.package.result == 'success' && needs.publish-npm.result == 'success' &&
          needs.verify-native-exact.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      receipt_artifact_id: ${{ steps.upload_receipt.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
      RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out CI-validated release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.bundle_artifact_id }}
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish-npm.outputs.receipt_artifact_id }}
          path: expected-receipt
          digest-mismatch: error
      - id: select_receipts
        name: Select the latest exact receipt for every native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          ids=$(node release-tooling/scripts/select-receipt-artifacts.mjs --phase exact --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY")
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select_receipts.outputs.ids }}
          path: exact-receipts
          digest-mismatch: error
      - name: Bind and merge every exact consumer checkpoint
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          node release-tooling/scripts/release-receipt-cli.mjs create --output identity.json \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --tooling-sha "$GITHUB_SHA" \
            --tag-object "$(git rev-parse "$RELEASE_TAG")" --build-run-id "$GITHUB_RUN_ID" \
            --artifact-id '${{ needs.package.outputs.bundle_artifact_id }}' --dist dist
          mkdir -p receipt
          node release-tooling/scripts/merge-release-receipts.mjs --expected identity.json --output receipt/release.json \
            expected-receipt/release.json exact-receipts/*/release.json
          jq -e '.channels | length == 9 and all(.[]; .state == "exact_consumer_verified" or .state == "promoted" or .state == "default_consumer_verified")' receipt/release.json >/dev/null
      - name: Promote npm defaults after immutable and exact consumer verification
        env:
          # dist-tag uses token authentication even when publication uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node release-tooling/scripts/promote-npm-channels.mjs --receipt receipt/release.json --dist dist
      - id: crate_default
        name: Verify the crate default without a registry mutation
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          node release-tooling/scripts/verify-crate-publication.mjs \
            --expected "target/package/hardgate-${RELEASE_VERSION}.crate" \
            --version "$RELEASE_VERSION" --source-sha "$RELEASE_COMMIT" --require-default
          node release-tooling/scripts/release-receipt-cli.mjs advance --receipt receipt/release.json --channel hardgate --to promoted
      - name: Promote the verified GitHub release to stable and latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-tooling/scripts/promote-github-channel.mjs --receipt receipt/release.json --dist dist --repo "$GITHUB_REPOSITORY"
      - name: Record crate default failure
        if: failure() && steps.crate_default.outcome == 'failure' && hashFiles('receipt/release.json') != ''
        run: node release-tooling/scripts/release-receipt-cli.mjs failure --receipt receipt/release.json --channel hardgate --code crate-default-failed --message 'Crate default verification failed; inspect the job before recovery.'
      - id: upload_receipt
        name: Retain the promotion receipt
        if: always() && hashFiles('receipt/release.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-promoted-attempt-${{ github.run_attempt }}
          path: receipt/release.json
          if-no-files-found: error
          retention-days: 90


