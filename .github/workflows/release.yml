      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}" "@yarnpkg/cli-dist@${YARN_VERSION}"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, Rust 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Download and verify the complete release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          cmp -- npm/hardgate/bin/hardgate.js release-tooling/npm/hardgate/bin/hardgate.js
          release_metadata=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
          release_tag=$(printf '%s\n' "$release_metadata" | jq -r '.tagName')
          release_is_draft=$(printf '%s\n' "$release_metadata" | jq -r '.isDraft')
          release_is_prerelease=$(printf '%s\n' "$release_metadata" | jq -r '.isPrerelease')
          latest_release_tag=$(gh release view --json tagName --jq .tagName)
          test "$release_tag" = "$RELEASE_TAG"
          test "$release_is_draft" = false
          test "$release_is_prerelease" = false
          test "$latest_release_tag" = "$RELEASE_TAG"
          assets=(
            hardgate-linux-x64.tar.gz
            hardgate-linux-x64-musl.tar.gz
            hardgate-linux-arm64.tar.gz
            hardgate-linux-arm64-musl.tar.gz
            hardgate-darwin-x64.tar.gz
            hardgate-darwin-arm64.tar.gz
            SHA256SUMS
            "hardgate-${RELEASE_VERSION}.sbom.cdx.json"
          )
          expected_assets=$(printf '%s\n' "${assets[@]}" | sort)
          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets"
          mkdir -p dist
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir dist
          done
          for asset in "${assets[@]}"; do test -s "dist/$asset"; done
          node scripts/release-verify.mjs --dist dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG"
          node scripts/release-sbom-verify.mjs --file "dist/hardgate-${RELEASE_VERSION}.sbom.cdx.json" --version "$RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          node release-tooling/scripts/verify-npm-publication.mjs --version "$RELEASE_VERSION" --dist dist

      - name: Verify published registry versions and runnable installs
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          expected="hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          npm_registry_probe() {
            name="$1"
            wanted="$2"
            encoded_name=$(printf '%s' "$name" | sed 's|/|%2f|g')
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}/${wanted}") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          # The unversioned registry document is authoritative for
          # dist-tags.latest; exact-version probes alone cannot prove the
          # package is the current release channel.
          npm_latest_probe() {
            name="$1"
            encoded_name=$(printf '%s' "$name" | sed 's|/|%2f|g')
            body=$(mktemp)
            status=$(curl --location --silent --show-error --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["dist-tags"]["latest"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          wait_for_latest_tag() {
            name="$1"
            wanted="$2"
            status=2
            deadline=$((SECONDS + HARDGATE_NPM_VISIBILITY_TIMEOUT_SECONDS))
            while :; do
              if actual=$(npm_latest_probe "$name"); then
                if [ "$actual" = "$wanted" ]; then
                  printf '%s\n' "$actual"
                  return 0
                fi
                echo "npm dist-tags.latest for $name is $actual; expected $wanted" >&2
                status=4
              else
                status=$?
                case "$status" in
                  1|2) ;;
                  *) return "$status" ;;
                esac
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "npm dist-tags.latest for $name did not settle on $wanted within ${HARDGATE_NPM_VISIBILITY_TIMEOUT_SECONDS}s" >&2
                return "$status"
              fi
              remaining=$((deadline - SECONDS))
              delay="$HARDGATE_REGISTRY_DELAY"
              if [ "$delay" -gt "$remaining" ]; then delay="$remaining"; fi
              [ "$delay" -gt 0 ] && sleep "$delay"
            done
          }
          wait_for_registry_version() {
            retry_absent="$1"
            name="$2"
            wanted="$3"
            deadline=$((SECONDS + HARDGATE_NPM_VISIBILITY_TIMEOUT_SECONDS))
            while :; do
              if actual=$(npm_registry_probe "$name" "$wanted"); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "npm registry version $name@$wanted remained unavailable for ${HARDGATE_NPM_VISIBILITY_TIMEOUT_SECONDS}s" >&2
                  return "$status"
                fi
                remaining=$((deadline - SECONDS))
                delay="$HARDGATE_REGISTRY_DELAY"
                if [ "$delay" -gt "$remaining" ]; then delay="$remaining"; fi
                [ "$delay" -gt 0 ] && sleep "$delay"
              fi
            done
          }
          crate_probe() {
            api="https://crates.io/api/v1/crates/hardgate/${RELEASE_VERSION}"
            body=$(mktemp)
            status=$(curl --location --silent --show-error --user-agent "$HARDGATE_CRATES_IO_USER_AGENT" --connect-timeout "$HARDGATE_CURL_CONNECT_TIMEOUT" --max-time "$HARDGATE_CURL_MAX_TIME" --output "$body" --write-out '%{http_code}' "$api") || {
              rm -f "$body"
              return 2
            }
            case "$status" in
              200)
                actual=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["num"])' < "$body") || {
                  rm -f "$body"
                  return 3
                }
                rm -f "$body"
                printf '%s\n' "$actual"
                return 0
                ;;
              404) rm -f "$body"; return 1 ;;
              *) rm -f "$body"; return 3 ;;
            esac
          }
          wait_for_crate_version() {
            retry_absent="$1"
            for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
              if actual=$(crate_probe); then
                printf '%s\n' "$actual"
                return 0
              else
                status=$?
                case "$status" in
                  1)
                    if [ "$retry_absent" -eq 0 ]; then return 1; fi
                    ;;
                  2) ;;
                  *) return "$status" ;;
                esac
                [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
              fi
            done
            return "$status"
          }
          test "$(wait_for_crate_version 1)" = "$RELEASE_VERSION"
          for pkg in hardgate-linux-x64 hardgate-linux-x64-musl hardgate-linux-arm64 hardgate-linux-arm64-musl hardgate-darwin-x64 hardgate-darwin-arm64; do
            test "$(wait_for_registry_version 1 "$pkg" "$RELEASE_VERSION")" = "$RELEASE_VERSION"
            test "$(wait_for_latest_tag "$pkg" "$RELEASE_VERSION")" = "$RELEASE_VERSION"
          done
          test "$(wait_for_registry_version 1 "@tech-byte-frontier/hardgate" "$RELEASE_VERSION")" = "$RELEASE_VERSION"
          test "$(wait_for_latest_tag "@tech-byte-frontier/hardgate" "$RELEASE_VERSION")" = "$RELEASE_VERSION"

          crate_root=$(mktemp -d)
          crate_installed=0
          for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
            if cargo install hardgate --version "=$RELEASE_VERSION" --locked --force --root "$crate_root"; then
              crate_installed=1
              break
            fi
            [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
          done
          test "$crate_installed" -eq 1
          test -x "$crate_root/bin/hardgate"
          test "$("$crate_root/bin/hardgate" --version)" = "$expected"

          npm_root=$(mktemp -d)
          npm init --yes --prefix "$npm_root" >/dev/null
          npm_installed=0
          for attempt in $(seq 1 "$HARDGATE_REGISTRY_ATTEMPTS"); do
            if npm install --ignore-scripts --no-audit --no-fund --prefix "$npm_root" "@tech-byte-frontier/hardgate@${RELEASE_VERSION}"; then
              npm_installed=1
              break
            fi
            [ "$attempt" -lt "$HARDGATE_REGISTRY_ATTEMPTS" ] && sleep "$HARDGATE_REGISTRY_DELAY"
          done
          test "$npm_installed" -eq 1
          npm_binary="$npm_root/node_modules/.bin/hardgate"
          test -x "$npm_binary"
          test "$("$npm_binary" --version)" = "$expected"

          # Exercise the documented global commands in isolated prefixes. A
          # minimal fresh-shell PATH proves users do not need the repository's
          # development PATH or a project-local node_modules directory.
          node_bin=$(dirname "$(command -v node)")
          npm_global=$(mktemp -d)
          npm install --global --ignore-scripts --no-audit --no-fund \
            --prefix "$npm_global" "@tech-byte-frontier/hardgate@${RELEASE_VERSION}"
          npm_executable="$npm_global/bin/hardgate"
          test -x "$npm_executable"
          env -i PATH="$npm_global/bin:$node_bin:/usr/bin:/bin" EXPECTED="$expected" \
            sh -c 'test "$(command -v hardgate)" = "$1" && test "$(hardgate --version)" = "$EXPECTED"' \
            sh "$npm_executable"

          pnpm_root=$(mktemp -d)
          mkdir -p "$pnpm_root/home" "$pnpm_root/bin" "$pnpm_root/config"
          (
            export HOME="$pnpm_root/home"
            export XDG_CONFIG_HOME="$pnpm_root/config"
            export PNPM_HOME="$pnpm_root"
            export PATH="$PNPM_HOME:$PNPM_HOME/bin:$PATH"
            pnpm add --global --ignore-scripts "@tech-byte-frontier/hardgate@${RELEASE_VERSION}"
          )
          pnpm_bin=$(HOME="$pnpm_root/home" XDG_CONFIG_HOME="$pnpm_root/config" \
            PNPM_HOME="$pnpm_root" PATH="$pnpm_root:$pnpm_root/bin:$PATH" pnpm bin --global)
          pnpm_executable="$pnpm_bin/hardgate"
          test -x "$pnpm_executable"
          env -i PATH="$pnpm_bin:$node_bin:/usr/bin:/bin" EXPECTED="$expected" \
            sh -c 'test "$(command -v hardgate)" = "$1" && test "$(hardgate --version)" = "$EXPECTED"' \
            sh "$pnpm_executable"

      - name: Verify clean npm, pnpm, Yarn, and Bun consumers
        env:
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
          PNPM_VERSION: ${{ env.PNPM_VERSION }}
          YARN_VERSION: ${{ env.YARN_VERSION }}
          BUN_VERSION: ${{ env.BUN_VERSION }}
          NPM_VERSION: ${{ env.NPM_VERSION }}
        run: |
          set -euo pipefail
          expected="hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          test "$(yarn --version)" = "$YARN_VERSION"
          test "$(bun --version)" = "$BUN_VERSION"

          pnpm_project=$(mktemp -d)
          npm init --yes --prefix "$pnpm_project" >/dev/null
          (cd "$pnpm_project" && pnpm add --ignore-scripts "@tech-byte-frontier/hardgate@${RELEASE_VERSION}")
          test "$($pnpm_project/node_modules/.bin/hardgate --version)" = "$expected"

          yarn_project=$(mktemp -d)
          npm init --yes --prefix "$yarn_project" >/dev/null
          printf '%s\n' 'nodeLinker: node-modules' > "$yarn_project/.yarnrc.yml"
          (cd "$yarn_project" && yarn add "@tech-byte-frontier/hardgate@${RELEASE_VERSION}")
          test "$($yarn_project/node_modules/.bin/hardgate --version)" = "$expected"

          bun_project=$(mktemp -d)
          npm init --yes --prefix "$bun_project" >/dev/null
          (cd "$bun_project" && bun add "@tech-byte-frontier/hardgate@${RELEASE_VERSION}")
          test "$($bun_project/node_modules/.bin/hardgate --version)" = "$expected"

      - name: Exercise the documented shell installer
        env:
          HARDGATE_VERSION: ${{ needs.version-check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          set -euo pipefail
          install_root=$(mktemp -d)
          HARDGATE_INSTALL_DIR="$install_root" sh scripts/install.sh
          test -x "$install_root/hardgate"
          test "$("$install_root/hardgate" --version)" = "hardgate ${RELEASE_VERSION} (${RELEASE_COMMIT})"

  release-complete:
    name: Release publication aggregate
    if: ${{ always() }}
    needs: [version-check, package, attest, publication-preflight, github-release, publish-crates, publish-npm, verify-channels]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every publication and verification job to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - run: echo "release publication and channel verification passed"
